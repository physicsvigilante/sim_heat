  windows-replay:
    if: github.base_ref == 'codex/radiation-shield-stack' && github.head_ref == 'codex/windows-offline-replay'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-h1-ci.txt
      - name: Verify Windows checkout bytes and offline conduction and radiation
        run: |
          git rev-parse HEAD > windows-source-head.txt
          python -B -m unittest -v tests.test_product_entry tests.test_product_docs tests.test_infer_wall_contact tests.test_infer_layer_conductivity tests.test_probed_wall_contacts tests.test_radiative_gap tests.test_shield_stack tests.test_supported_radiative_gap tests.test_furnace_wall_lesson 2>&1 | Tee-Object windows-offline.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -m unittest -v tests.test_source_preview.SourcePreviewTests.test_original_native_diagnostic_catalog_never_changed 2>&1 | Tee-Object -Append windows-offline.txt
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-offline-replay-${{ github.event.pull_request.head.sha }}
          path: |
            windows-source-head.txt
            windows-offline.txt
