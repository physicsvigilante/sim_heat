name: Series extension of a two-terminal wall
on:
  pull_request:
    branches: [codex/terminal-resistance, codex/series-equivalence, codex/steady-bridge, codex/temperature-crossing, codex/heat-flow-reversal, codex/network-calorimetry, codex/study-observation-passages, codex/thermal-terminal-response, codex/join-thermal-networks, codex/thermal-port-relaxation, codex/rod-resistance-sensitivity, codex/finite-conductivity-bounds, codex/isolated-pair-exchange, codex/two-contact-join, codex/loaded-thermal-ports, codex/conduction-walkthrough, codex/radiating-surface, codex/radiative-gap, codex/radiation-shield]
permissions:
  contents: read
jobs:
  wall:
    if: |
      (github.base_ref == 'codex/terminal-resistance' && github.head_ref == 'codex/series-equivalence') ||
      (github.base_ref == 'codex/series-equivalence' && github.head_ref == 'codex/steady-bridge') ||
      (github.base_ref == 'codex/steady-bridge' && github.head_ref == 'codex/temperature-crossing') ||
      (github.base_ref == 'codex/temperature-crossing' && github.head_ref == 'codex/heat-flow-reversal') ||
      (github.base_ref == 'codex/heat-flow-reversal' && github.head_ref == 'codex/network-calorimetry') ||
      (github.base_ref == 'codex/network-calorimetry' && github.head_ref == 'codex/study-observation-passages') ||
      (github.base_ref == 'codex/study-observation-passages' && github.head_ref == 'codex/thermal-terminal-response') ||
      (github.base_ref == 'codex/thermal-terminal-response' && github.head_ref == 'codex/join-thermal-networks') ||
      (github.base_ref == 'codex/join-thermal-networks' && github.head_ref == 'codex/thermal-port-relaxation') ||
      (github.base_ref == 'codex/thermal-port-relaxation' && github.head_ref == 'codex/rod-resistance-sensitivity') ||
      (github.base_ref == 'codex/rod-resistance-sensitivity' && github.head_ref == 'codex/finite-conductivity-bounds') ||
      (github.base_ref == 'codex/finite-conductivity-bounds' && github.head_ref == 'codex/isolated-pair-exchange') ||
      (github.base_ref == 'codex/isolated-pair-exchange' && github.head_ref == 'codex/two-contact-join') ||
      (github.base_ref == 'codex/two-contact-join' && github.head_ref == 'codex/loaded-thermal-ports') ||
      (github.base_ref == 'codex/loaded-thermal-ports' && github.head_ref == 'codex/conduction-walkthrough') ||
      (github.base_ref == 'codex/conduction-walkthrough' && github.head_ref == 'codex/radiating-surface') ||
      (github.base_ref == 'codex/radiating-surface' && github.head_ref == 'codex/radiative-gap') ||
      (github.base_ref == 'codex/radiative-gap' && github.head_ref == 'codex/radiation-shield') ||
      (github.base_ref == 'codex/radiation-shield' && github.head_ref == 'codex/radiation-power-bounds')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-h1-ci.txt
      - name: Run inherited H1 offline baseline
        run: python -B -m unittest discover -s h1/tests -v
      - run: python -B -m unittest -v tests.test_composite_wall tests.test_wall_revision tests.test_terminal_resistance tests.test_series_extension
      - name: Replay through the general conduction CLI
        run: |
          python -B -m tools.terminal_resistance --root h1/cases/S1 --study h1/cases/S1/study.json --facts h1/reference_cases/S1.json --facts-sha256 47b1d9035230cb252a992a3fdcdbdf6fbefd350f901aacaaae9dae37b561635a > series-output.json
          python -B -m qualification.h1_n13.conduction --root studies/series_extension --study studies/series_extension/study.json --facts studies/series_extension/facts.json --facts-sha256 1a60624f561e9edbf0e2457c127b06e9425bc9c6a0b6b576945f40413cd71d44 > full-network.json
          dir=studies/composite_wall
          python -B -m tools.terminal_resistance --root "$dir" --study "$dir/study.json" --facts "$dir/facts.json" --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b > wall-output.json
          python -B -m tools.terminal_resistance --root "$dir" --study "$dir/higher_k.json" --facts "$dir/higher_k_facts.json" --facts-sha256 7b266f98ac5952ddc385e1555b6238fa775ef453c2eac4c899ff2e4a283b9e79 > revised-wall-output.json
      - name: Verify steady bridge and replay both configurations
        if: github.head_ref == 'codex/steady-bridge' || github.head_ref == 'codex/temperature-crossing' || github.head_ref == 'codex/heat-flow-reversal' || github.head_ref == 'codex/network-calorimetry' || github.head_ref == 'codex/study-observation-passages' || github.head_ref == 'codex/thermal-terminal-response' || github.head_ref == 'codex/join-thermal-networks' || github.head_ref == 'codex/thermal-port-relaxation' || github.head_ref == 'codex/rod-resistance-sensitivity' || github.head_ref == 'codex/finite-conductivity-bounds' || github.head_ref == 'codex/isolated-pair-exchange' || github.head_ref == 'codex/two-contact-join' || github.head_ref == 'codex/loaded-thermal-ports' || github.head_ref == 'codex/conduction-walkthrough'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v tests.test_steady_bridge
          dir=studies/steady_bridge
          mkdir bridge
          replay() {
            local label="$1" prefix="$2" pin="$3"
            local args=(--root "$dir" --study "$dir/${prefix}study.json" --facts "$dir/${prefix}facts.json" --facts-sha256 "$pin")
            python -B -m qualification.h1_n13.conduction "${args[@]}" > "bridge/$label.json"
            python -B -m tools.terminal_resistance "${args[@]}" > "bridge/$label-resistance.json"
          }
          replay balanced '' 4cc763729e8d71b0abfc0eb5d1c3cc4d08185225104af8640541adcfdbf10bbf
          replay revised changed_ 9e62ef107a7499beb80406ac8b54b35e084830eb17f8d370ce96888884ba9f1f
      - name: Run threshold regressions and archive observed passages
        if: github.head_ref == 'codex/temperature-crossing' || github.head_ref == 'codex/heat-flow-reversal' || github.head_ref == 'codex/network-calorimetry' || github.head_ref == 'codex/study-observation-passages' || github.head_ref == 'codex/thermal-terminal-response' || github.head_ref == 'codex/join-thermal-networks' || github.head_ref == 'codex/thermal-port-relaxation' || github.head_ref == 'codex/rod-resistance-sensitivity' || github.head_ref == 'codex/finite-conductivity-bounds' || github.head_ref == 'codex/isolated-pair-exchange' || github.head_ref == 'codex/two-contact-join' || github.head_ref == 'codex/loaded-thermal-ports'
        run: |
          python -B -m unittest -v tests.test_temperature_passages
          mkdir passages
          d=qualification/h1_n13/heldout
          python -B -m tools.temperature_passages --study "$d/study.json" --root "$d" --facts "$d/facts.json" --facts-sha256 57c393f2b11bf658a378b6fa6ab96425b14116b8c2fc519e4bedba1e883d1783 --body blue --threshold-k 307 > passages/blue.json
          d=h1/cases/D1
          python -B -m tools.temperature_passages --study "$d/study.json" --root "$d" --facts h1/reference_cases/D1.json --facts-sha256 92c913bd9a59fee7af14170f459f0959deee8da7d6876e4be222d3c3e94b71c7 --body body --threshold-k 323.15 > passages/single.json
      - name: Exercise rod reversal observations
        if: github.head_ref == 'codex/heat-flow-reversal' || github.head_ref == 'codex/network-calorimetry' || github.head_ref == 'codex/study-observation-passages' || github.head_ref == 'codex/thermal-terminal-response' || github.head_ref == 'codex/join-thermal-networks' || github.head_ref == 'codex/thermal-port-relaxation' || github.head_ref == 'codex/rod-resistance-sensitivity' || github.head_ref == 'codex/finite-conductivity-bounds' || github.head_ref == 'codex/isolated-pair-exchange' || github.head_ref == 'codex/two-contact-join' || github.head_ref == 'codex/loaded-thermal-ports'
        run: |
          python -B -m unittest -v tests.test_heat_flow_reversals
          d=qualification/h1_n13/heldout
          python -B -m tools.heat_flow_reversals --root "$d" --study "$d/study.json" --facts "$d/facts.json" --facts-sha256 57c393f2b11bf658a378b6fa6ab96425b14116b8c2fc519e4bedba1e883d1783 --rod lower > passages/lower-reversal.json
      - name: Verify isolated equilibrium and compare the pinned conductivity revision
        if: github.head_ref == 'codex/network-calorimetry' || github.head_ref == 'codex/study-observation-passages' || github.head_ref == 'codex/thermal-terminal-response' || github.head_ref == 'codex/join-thermal-networks' || github.head_ref == 'codex/thermal-port-relaxation' || github.head_ref == 'codex/rod-resistance-sensitivity' || github.head_ref == 'codex/finite-conductivity-bounds' || github.head_ref == 'codex/isolated-pair-exchange' || github.head_ref == 'codex/two-contact-join' || github.head_ref == 'codex/loaded-thermal-ports'
        run: |
          python -B -m unittest -v tests.test_network_calorimetry
          mkdir calorimetry
          python -B -m tools.network_calorimetry --root h1/cases/D2 --study h1/cases/D2/study.json --facts h1/reference_cases/D2.json --facts-sha256 befcb977a08bdb4d3f15d903ebafccf910d83675f8d1a92f1988bca74a8a547a > calorimetry/original.json
          python -B -m tools.network_calorimetry --root h1/cases --study h1/cases/D2_K2/study.json --facts h1/reference_cases/D2_K2.json --facts-sha256 d4da4597c01cb175d6b0b02c10ec055a9653a9e56e2ffc6e0d74a6335a150b6f > calorimetry/revision.json
          python - <<'PY'
          import json
          from decimal import Decimal, getcontext
          from fractions import Fraction
          from pathlib import Path
          getcontext().prec = 70
          for name, exponent in (("original", -5), ("revision", -10)):
              result = json.loads(Path("calorimetry", name + ".json").read_bytes())
              component, = result["components"]
              assert Fraction(component["equilibriumTemperatureK"]) == Fraction("308.15")
              assert result["finalTimeSeconds"] == "9375"
              lo, hi = map(Fraction, component["finalSpreadBoundsK"])
              expected = Fraction(60 * Decimal(exponent).exp())
              guard = Fraction(1, 10**68)
              assert lo <= expected - guard <= expected + guard <= hi
              assert hi - lo < Fraction(1, 10**10)
          PY
      - name: Verify passages of authored observations
        if: github.head_ref == 'codex/study-observation-passages' || github.head_ref == 'codex/thermal-terminal-response' || github.head_ref == 'codex/join-thermal-networks' || github.head_ref == 'codex/thermal-port-relaxation' || github.head_ref == 'codex/rod-resistance-sensitivity' || github.head_ref == 'codex/finite-conductivity-bounds' || github.head_ref == 'codex/isolated-pair-exchange' || github.head_ref == 'codex/two-contact-join' || github.head_ref == 'codex/loaded-thermal-ports'
        run: |
          python -B -m unittest -v tests.test_observation_passages
          python -B -m tools.observation_passages --root h1/cases/D2 --study h1/cases/D2/study.json --facts h1/reference_cases/D2.json --facts-sha256 befcb977a08bdb4d3f15d903ebafccf910d83675f8d1a92f1988bca74a8a547a --request-id difference --threshold 1 --unit K > passages/request-difference.json
          python -B -m tools.observation_passages --root h1/cases/D1 --study h1/cases/D1/study.json --facts h1/reference_cases/D1.json --facts-sha256 92c913bd9a59fee7af14170f459f0959deee8da7d6876e4be222d3c3e94b71c7 --request-id energy --threshold 15000 --unit J > passages/request-energy.json
      - name: Verify three-terminal response and archive both networks
        if: github.head_ref == 'codex/thermal-terminal-response' || github.head_ref == 'codex/join-thermal-networks' || github.head_ref == 'codex/thermal-port-relaxation' || github.head_ref == 'codex/rod-resistance-sensitivity' || github.head_ref == 'codex/finite-conductivity-bounds' || github.head_ref == 'codex/isolated-pair-exchange' || github.head_ref == 'codex/two-contact-join' || github.head_ref == 'codex/loaded-thermal-ports'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v tests.test_terminal_response
          mkdir terminal-response
          replay() {
            local topology="$1" pin="$2" dir="studies/three_terminal/$1"
            local args=(--root "$dir" --study "$dir/study.json" --facts "$dir/facts.json" --facts-sha256 "$pin")
            python -B -m tools.terminal_response "${args[@]}" > "terminal-response/$topology.json"
            python -B -m qualification.h1_n13.conduction "${args[@]}" > "terminal-response/$topology-direct.json"
          }
          replay star 16c414cf443e389560056bb782ac3dea0ac75c40cf2ba103fa0de25bef18def0
          replay triangle 14e792903c1a8fc7c8d8ebb1c9e11e09a1a4474ff7e716de47d770df13177924
      - name: Compare joined laws to the explicitly connected six rods
        if: github.head_ref == 'codex/join-thermal-networks' || github.head_ref == 'codex/thermal-port-relaxation' || github.head_ref == 'codex/rod-resistance-sensitivity' || github.head_ref == 'codex/finite-conductivity-bounds' || github.head_ref == 'codex/isolated-pair-exchange' || github.head_ref == 'codex/two-contact-join' || github.head_ref == 'codex/loaded-thermal-ports'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v tests.test_join_thermal_networks
          mkdir joined
          l=studies/three_terminal/star
          r=studies/three_terminal/triangle
          f=studies/joined_terminals
          python -B -m tools.join_thermal_networks --left-study "$l/study.json" --left-root "$l" --left-facts "$l/facts.json" --left-facts-sha256 16c414cf443e389560056bb782ac3dea0ac75c40cf2ba103fa0de25bef18def0 --left-port middle --right-study "$r/study.json" --right-root "$r" --right-facts "$r/facts.json" --right-facts-sha256 14e792903c1a8fc7c8d8ebb1c9e11e09a1a4474ff7e716de47d770df13177924 --right-port warm > joined/composition.json
          args=(--root "$f" --study "$f/study.json" --facts "$f/facts.json" --facts-sha256 bf8bebb43189f2034ce3be32e3441f14c8b684eaf9e3a19876a2361a0f0482a9)
          python -B -m qualification.h1_n13.conduction "${args[@]}" > joined/direct.json
          python -B -m tools.terminal_response "${args[@]}" > joined/direct-response.json
      - name: Verify the loaded-body thermal relaxation law
        if: github.head_ref == 'codex/thermal-port-relaxation' || github.head_ref == 'codex/rod-resistance-sensitivity' || github.head_ref == 'codex/finite-conductivity-bounds' || github.head_ref == 'codex/isolated-pair-exchange' || github.head_ref == 'codex/two-contact-join' || github.head_ref == 'codex/loaded-thermal-ports'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v tests.test_body_relaxation
          mkdir relaxation
          f=studies/loaded_star
          args=(--root "$f" --study "$f/study.json" --facts "$f/facts.json" --facts-sha256 1fccce839e69c67230819498fb1da973ac614264378ada75ae7d0b13b7816ff8)
          python -B -m tools.body_relaxation "${args[@]}" > relaxation/law.json
          python -B -m qualification.h1_n13.conduction "${args[@]}" > relaxation/full-history.json
      - name: Verify resistance sensitivities and replay bridge balance
        if: github.head_ref == 'codex/rod-resistance-sensitivity' || github.head_ref == 'codex/finite-conductivity-bounds' || github.head_ref == 'codex/isolated-pair-exchange' || github.head_ref == 'codex/two-contact-join' || github.head_ref == 'codex/loaded-thermal-ports'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v tests.test_resistance_sensitivity
          mkdir sensitivities
          replay() {
            local dir="$1" prefix="$2" pin="$3" label="$4"
            python -B -m tools.resistance_sensitivity --root "$dir" --study "$dir/${prefix}study.json" --facts "$dir/${prefix}facts.json" --facts-sha256 "$pin" > "sensitivities/$label.json"
          }
          replay studies/composite_wall '' f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b wall
          replay studies/steady_bridge '' 4cc763729e8d71b0abfc0eb5d1c3cc4d08185225104af8640541adcfdbf10bbf balanced
          replay studies/steady_bridge changed_ 9e62ef107a7499beb80406ac8b54b35e084830eb17f8d370ce96888884ba9f1f revised
      - name: Bound a finite conductivity change and compare with the revised study
        if: github.head_ref == 'codex/finite-conductivity-bounds' || github.head_ref == 'codex/isolated-pair-exchange' || github.head_ref == 'codex/two-contact-join' || github.head_ref == 'codex/loaded-thermal-ports'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v tests.test_conductivity_change_bounds
          f=studies/composite_wall
          python -B -m tools.conductivity_change_bounds --root "$f" --study "$f/study.json" --facts "$f/facts.json" --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --rod insert --conductivity-multiplier 7/3 > wall-change-bounds.json
      - name: Verify insulated two-body exchange and its transient history
        if: github.head_ref == 'codex/isolated-pair-exchange' || github.head_ref == 'codex/two-contact-join' || github.head_ref == 'codex/loaded-thermal-ports' || github.head_ref == 'codex/conduction-walkthrough'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v tests.test_isolated_pair_exchange
          args=(--root h1/cases/D2 --study h1/cases/D2/study.json --facts h1/reference_cases/D2.json --facts-sha256 befcb977a08bdb4d3f15d903ebafccf910d83675f8d1a92f1988bca74a8a547a)
          mkdir pair
          python -B -m tools.isolated_pair_exchange "${args[@]}" > pair/exchange.json
          python -B -m qualification.h1_n13.conduction "${args[@]}" > pair/full-history.json
      - name: Join two networks at two contacts and replay the six-rod assembly
        if: github.head_ref == 'codex/two-contact-join' || github.head_ref == 'codex/loaded-thermal-ports'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v tests.test_two_contact_join
          mkdir two-contacts
          l=studies/three_terminal/star
          r=studies/three_terminal/triangle
          f=studies/two_contacts
          python -B -m tools.two_contact_join --left-study "$l/study.json" --left-root "$l" --left-facts "$l/facts.json" --left-facts-sha256 16c414cf443e389560056bb782ac3dea0ac75c40cf2ba103fa0de25bef18def0 --right-study "$r/study.json" --right-root "$r" --right-facts "$r/facts.json" --right-facts-sha256 14e792903c1a8fc7c8d8ebb1c9e11e09a1a4474ff7e716de47d770df13177924 --first-contact middle warm --second-contact cool middle > two-contacts/law.json
          python -B -m qualification.h1_n13.conduction --study "$f/study.json" --root "$f" --facts "$f/facts.json" --facts-sha256 76cbdba2b79184ef560b7cb74d336fedd459492d499216221267b3b1a36c2329 > two-contacts/direct.json
      - name: Compare loaded thermal ports with the nine-rod assembly
        if: github.head_ref == 'codex/loaded-thermal-ports'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v tests.test_loaded_thermal_ports
          mkdir loaded-ports
          l=studies/three_terminal/star
          r=studies/three_terminal/triangle
          w=studies/composite_wall
          f=studies/loaded_thermal_ports
          python -B -m tools.loaded_thermal_ports --left-study "$l/study.json" --left-root "$l" --left-facts "$l/facts.json" --left-facts-sha256 16c414cf443e389560056bb782ac3dea0ac75c40cf2ba103fa0de25bef18def0 --link-study "$w/study.json" --link-root "$w" --link-facts "$w/facts.json" --link-facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --right-study "$r/study.json" --right-root "$r" --right-facts "$r/facts.json" --right-facts-sha256 14e792903c1a8fc7c8d8ebb1c9e11e09a1a4474ff7e716de47d770df13177924 --left-port middle --right-port warm > loaded-ports/reduced.json
          python -B -m qualification.h1_n13.conduction --study "$f/study.json" --root "$f" --facts "$f/facts.json" --facts-sha256 137e707179de334e72df970facb62c5eb29c46e49a8462985f0660c6d7d2c476 > loaded-ports/direct.json
      - name: Verify and replay steady surface radiation
        if: github.head_ref == 'codex/radiating-surface' || github.head_ref == 'codex/radiative-gap' || github.head_ref == 'codex/radiation-shield' || github.head_ref == 'codex/radiation-power-bounds'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v tests.test_radiating_surface tests.test_loaded_thermal_ports
          mkdir radiation
          w=studies/composite_wall
          for temp in 280 450; do
            python -B -m tools.radiating_surface --root "$w" --study "$w/study.json" --facts "$w/facts.json" --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --port cold --enclosure-k "$temp" --area-m2 0.020 --emissivity 0.8 --sigma 0.0000000567 > "radiation/wall-$temp.json"
          done
      - name: Compare two-plate exchange with four independent radiosity and wall balances
        if: github.head_ref == 'codex/radiative-gap' || github.head_ref == 'codex/radiation-shield' || github.head_ref == 'codex/radiation-power-bounds'
        run: |
          python -B -m unittest -v tests.test_radiative_gap
          python -B -m tools.radiative_gap --left-root studies/composite_wall --left-study studies/composite_wall/study.json --left-facts studies/composite_wall/facts.json --left-facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --right-root studies/composite_wall --right-study studies/composite_wall/study.json --right-facts studies/composite_wall/facts.json --right-facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --left-port cold --right-port hot --area-m2 0.020 --left-emissivity 0.8 --right-emissivity 0.5 --sigma 0.0000000567 > radiation/gap.json
      - name: Check floating shield balance and replay distinct face coatings
        if: github.head_ref == 'codex/radiation-shield' || github.head_ref == 'codex/radiation-power-bounds'
        run: |
          python -B -m unittest -v tests.test_radiation_shield
          python -B -m tools.radiative_gap --left-root studies/composite_wall --left-study studies/composite_wall/study.json --left-facts studies/composite_wall/facts.json --left-facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --right-root studies/composite_wall --right-study studies/composite_wall/study.json --right-facts studies/composite_wall/facts.json --right-facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --left-port cold --right-port hot --area-m2 0.020 --left-emissivity 0.8 --right-emissivity 0.5 --sigma 0.0000000567 --shield-emissivities 0.6 0.3 > radiation/shield.json
      - name: Replay extreme single-surface power enclosure
