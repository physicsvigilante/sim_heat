name: H1-C1 F02 release readiness HOLD (read-only, NO OMC)
on:
  push:
    branches:
      - qualification/h1-c1-f02-readiness-hold-audit
  # No paths filter: source/dependency drift must be checked on every push.
permissions:
  contents: read
concurrency:
  group: simheat-h1-c1-f02-RELEASE-BLOCKED-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  explicitly-blocked-nonnative:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact historical source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install OFFLINE numerical check dependencies, not Modelica
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Verify five additions only, original frozen SHA-pinned F0 inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c1_f02_release_blocker_evidence
          git rev-parse HEAD > c1_f02_release_blocker_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > c1_f02_release_blocker_evidence/head-tree.txt
          git diff --name-status ebe203781e87ba108e8dec845074ca7ca47972ef HEAD > c1_f02_release_blocker_evidence/source-diff.txt
          git ls-files -z | xargs -0 sha256sum > c1_f02_release_blocker_evidence/source.sha256
          sha256sum --check qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256 > c1_f02_release_blocker_evidence/frozen-f0-shas.txt
          python - <<'PY'
          from pathlib import Path
          expected={
              'qualification/h1_c1/f02/RELEASE_GATES_ABSENT.json',
              'qualification/h1_c1/f02/offline_release_readiness_hold.py',
              'qualification/h1_c1/f02/test_offline_release_readiness_hold.py',
              'qualification/h1_c1/f02/READINESS_HOLD_SCOPE.md',
              '.github/workflows/h1-c1-f02-release-readiness-hold.yml',
          }
          rows=Path('c1_f02_release_blocker_evidence/source-diff.txt').read_text().splitlines()
          assert len(rows)==5,rows
          assert all(row.startswith('A\t') for row in rows),rows
          assert {row.split('\t',1)[1] for row in rows}==expected,rows
          PY
          printf '%s  %s\n' 'fc5a7df5928c3fb8aef2ba4af516dfbd32b42c0450ebef1051ad4fd7efebd17f' 'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE.json.xz' | sha256sum --check
          printf '%s  %s\n' '50467b138ed64cdb908f2c763bc777e6babf0bb04a0711568acc559112e66f84' 'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE_MANIFEST.json' | sha256sum --check
          python --version > c1_f02_release_blocker_evidence/python.txt
          python -m pip freeze > c1_f02_release_blocker_evidence/packages.txt
      - name: Audit exact approved science AND prove eleven native release gates MISSING
        shell: bash
        run: |
          set -euo pipefail
          python -B -m qualification.h1_c1.f02.offline_release_readiness_hold inspect-pre-native-hold-only > c1_f02_release_blocker_evidence/readiness-hold.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('c1_f02_release_blocker_evidence/readiness-hold.json').read_text())
          assert r['status']=='BLOCKED_11_NATIVE_RELEASE_GATES_MISSING_OFFLINE_ONLY'
          assert r['releaseBlocked'] is True
          assert r['readOnlyScientificSourceIdentityVerified'] is True
          assert r['sourcePinsVerified']==23 and r['referenceChannels']==37
          assert r['referenceGridSamples']==4001 and r['flowIntegralHistories']==4
          assert r['publicRequests']==9
          assert r['missingRequiredGateCount']==11
          assert len(set(r['missingRequiredNativeReleaseGates']))==11
          assert r['approvedArchivedReferenceRawSha256']=='0db511dd8dba023d16518667de256029cf3e073463ea21e2478aeac8afd1f368'
          assert r['approvedArchivedReferenceSeal']=='d2b8e2ca8e1f929cac7b028dcc3f7d0b453921d193f877eb091e23ac70aa4ce9'
          flags=('nativeAllowed','nativeExecuted','nativeQualified','nativePlanApproved',
                 'ownerIdentityAuthenticatedExternally','ownerNativeLaunchApproved',
                 'trustedReleaseReady','realAcrossRunReservationAllocated',
                 'ownerControlledExternalStoreConnected','compilerOrHostObserved',
                 'compilerQueried','buildInvoked','modelLaunched','referenceRegenerated',
                 'originalF0Static100xPassed','pr32BitwiseReproductionPassed')
          for k in flags:
              assert r[k] is False,k
          print('PASS OFFLINE AUDIT: explicit eleven-release-gate HOLD, ZERO NATIVE AUTHORITY')
          PY
      - name: Native/build/owner actions are absent from CLI
        shell: bash
        run: |
          set -euo pipefail
          for action in execute approve reserve-native native build omc launch ready release run; do
            if python -B -m qualification.h1_c1.f02.offline_release_readiness_hold "${action}" > c1_f02_release_blocker_evidence/forbidden-${action}.stdout 2> c1_f02_release_blocker_evidence/forbidden-${action}.stderr; then
              echo 'FAIL: native/owner action unexpectedly accepted'; exit 1
            fi
          done
      - name: New strict readiness-HOLD and fake-owner refusal tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.f02.test_offline_release_readiness_hold -v 2>&1 | tee c1_f02_release_blocker_evidence/release-readiness-tests.txt
      - name: Previous reviewed default-deny CAS, SQLite, TEXT and reference checks
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.f02.test_offline_external_cas_contract -v 2>&1 | tee c1_f02_release_blocker_evidence/fake-cas-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_offline_one_shot_ledger_simulator -v 2>&1 | tee c1_f02_release_blocker_evidence/local-ledger-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_offline_build_script_preview -v 2>&1 | tee c1_f02_release_blocker_evidence/build-text-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_stage_immutable_inputs -v 2>&1 | tee c1_f02_release_blocker_evidence/staging-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_offline_control_preflight -v 2>&1 | tee c1_f02_release_blocker_evidence/disabled-plan-tests.txt
          python -B -m unittest qualification.h1_c1.option_a.test_offline_reference_consumer -v 2>&1 | tee c1_f02_release_blocker_evidence/owner-offline-consumer-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_option_a_binding_preflight -v 2>&1 | tee c1_f02_release_blocker_evidence/reference-binding-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_pr31_fixture -v 2>&1 | tee c1_f02_release_blocker_evidence/archival-tests.txt
      - name: Retest all original 149 frozen H1 checks
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee c1_f02_release_blocker_evidence/original-h1-tests.txt
      - name: Archive OFFLINE holds, refusals, test logs, and original source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-c1-f02-release-BLOCKED-readiness-${{ github.sha }}
          path: c1_f02_release_blocker_evidence/
          retention-days: 90
          if-no-files-found: warn
