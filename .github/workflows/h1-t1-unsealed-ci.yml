name: H1-T1 unsealed first-attempt offline evaluation — no native
on:
  push:
    branches: [trial/h1-t1-unsealed]
  pull_request:
    branches: [main]
    paths:
      - experiments/h1_t1_unsealed/**
      - .github/workflows/h1-t1-unsealed-ci.yml
permissions:
  contents: read
concurrency:
  group: h1-t1-unsealed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned offline and HTTP browser dependencies - NEVER OpenModelica
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 playwright==1.57.0
      - name: Select Chromium
        run: |
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif command -v chromium >/dev/null; then chromium --version
          else python -m playwright install --with-deps chromium; fi
      - name: Capture actual checkout and strict evidence-only source scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h1_t1_unsealed_evidence
          git rev-parse HEAD > h1_t1_unsealed_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > h1_t1_unsealed_evidence/head-tree.txt
          scope_base=f52613c39c539b2d4543a9838e5658d526fca10e
          if [ "${{ github.event_name }}" = pull_request ]; then
            scope_base="$(git rev-parse HEAD^1)"
            test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
          fi
          test "$scope_base" = f52613c39c539b2d4543a9838e5658d526fca10e
          printf '%s\n' "$scope_base" > h1_t1_unsealed_evidence/scope-base-sha.txt
          git diff --name-status "$scope_base" HEAD > h1_t1_unsealed_evidence/source-diff.txt
          python - <<'PY'
          from pathlib import Path
          actual = Path('h1_t1_unsealed_evidence/source-diff.txt').read_text().splitlines()
          names = [
            '.github/workflows/h1-t1-unsealed-ci.yml',
            'experiments/h1_t1_unsealed/DERIVATION.json',
            'experiments/h1_t1_unsealed/evaluate_first_attempt.py',
            'experiments/h1_t1_unsealed/browser_smoke.py',
            *[f'experiments/h1_t1_unsealed/{p}' for p in (
              'S/model.mo','S/study.json','S/AUTHOR_NOTES.md',
              'T/model.mo','T/study.json','T/AUTHOR_NOTES.md','X/REFUSAL.md')],
          ]
          expected = {f'A\t{p}' for p in names}
          assert len(actual) == len(expected) and set(actual) == expected, actual
          PY
          git diff --exit-code "$scope_base" HEAD -- h1 viewer qualification docs tools requirements-h1-ci.txt
          git archive --format=tar HEAD > h1_t1_unsealed_evidence/source.tar
          python -m pip freeze > h1_t1_unsealed_evidence/packages.txt
      - name: Run inherited offline H1 source checking suite
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee h1_t1_unsealed_evidence/h1-baseline-tests.log
          node --test viewer/source_preview/core.test.mjs 2>&1 | tee h1_t1_unsealed_evidence/source-browser-core.log
          python -B tools/render_product_docs.py --check 2>&1 | tee h1_t1_unsealed_evidence/document-parity.log
      - name: Evaluate two ORIGINAL first attempts and preserve any refusal
        shell: bash
        run: |
          set -euo pipefail
          python -B experiments/h1_t1_unsealed/evaluate_first_attempt.py --out h1_t1_unsealed_evidence 2>&1 | tee h1_t1_unsealed_evidence/offline-evaluation.log
      - name: Real HTTP Chromium inspection of any admitted original source previews
        shell: bash
        run: |
          set -euo pipefail
          python -B experiments/h1_t1_unsealed/browser_smoke.py --out h1_t1_unsealed_evidence/chromium --receipts h1_t1_unsealed_evidence 2>&1 | tee h1_t1_unsealed_evidence/browser.log
      - name: Retain original derived source, actual stage receipts and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-t1-unsealed-${{ github.sha }}
          path: h1_t1_unsealed_evidence/
          retention-days: 90
          if-no-files-found: error
