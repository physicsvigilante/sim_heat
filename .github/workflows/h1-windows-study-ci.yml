name: Windows offline study admission
on:
  pull_request:
    branches: [numerics/h1-n12-triple-case-reference-staging]

permissions:
  contents: read

jobs:
  study-paths:
    if: github.head_ref == 'codex/windows-study-path'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Preserve source bytes during checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned offline test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-h1-ci.txt
      - name: Check Windows admission, authored path refusals and N1 source identities
        run: python -s -B -m unittest -v h1.tests.test_study_paths qualification.h1_windows_study.test_source_admission
