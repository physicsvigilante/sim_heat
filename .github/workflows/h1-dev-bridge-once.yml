name: H1 developer thermal bridge one-shot diagnostic

on:
  push:
    branches:
      - experiment/h1-developer-thermal-bridge
    paths:
      - .github/workflows/h1-dev-bridge-once.yml

permissions:
  contents: read

concurrency:
  group: sim-heat-developer-bridge-one-shot
  cancel-in-progress: false

jobs:
  bridge:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAN_PIN: 6404fb03f5b141851f4af520da506cf8f997903cff2385181d450c2ecb3f2709
    steps:
      - name: Checkout fixed physical case and frozen implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned production and checking-only dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Run complete offline suite and seal original bridge reference
        run: python -B tools/h1_native_batch.py prepare --plan experiments/dev_bridge/native_plan.json --pin "$PLAN_PIN"
      - name: Reproduce 80-digit reference accuracy before any native build
        run: >-
          python -B experiments/dev_bridge/check_reference_accuracy.py
          --bundle dev_bridge_native_attempt/case_01/reference.bundle.json
          --out dev_bridge_native_attempt/reference_accuracy.json
          > dev_bridge_native_attempt/reference_accuracy.log 2>&1
      - name: Set up OpenModelica 1.27.0 with MSL 4.0.0
        uses: OpenModelica/setup-openmodelica@419f31141aa79a22f7033def5626047dd3bb5069
        with:
          version: '1.27.0'
          packages: |
            omc
          libraries: |
            Modelica 4.0.0
      - name: One build and launch through unchanged runner and checker
        run: python -B tools/h1_native_batch.py execute --plan experiments/dev_bridge/native_plan.json --pin "$PLAN_PIN"
      - name: Preserve original inputs, native outputs, reference checks and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-developer-bridge-native-evidence
          path: dev_bridge_native_attempt/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
