name: H1-C1 F0 immutable PR31 checking fixture candidate verification (offline only)
on:
  push:
    branches:
      - qualification/h1-c1-f0-immutable-fixture-candidate
    paths:
      - '.github/workflows/h1-c1-f0-fixture-verify.yml'
      - '.github/workflows/h1-c1-f0-archive-pr31-fixture-once.yml'
      - 'qualification/h1_c1/immutable_fixture/**'
permissions:
  contents: read
concurrency:
  group: simheat-c1-fixture-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-and-storage-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate (no write token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install historical F0 test dependencies only
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Verify exact archived bytes, candidate scope and F0 frozen source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c1_immutable_fixture_evidence
          git rev-parse HEAD > c1_immutable_fixture_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > c1_immutable_fixture_evidence/head-tree.txt
          git diff --name-status 502a6e8c392d8b8cfb8a4361cddcae4fafff6f01 HEAD \
            > c1_immutable_fixture_evidence/source-diff.txt
          git ls-files -z | xargs -0 sha256sum > c1_immutable_fixture_evidence/source.sha256
          python - <<'PY'
          from pathlib import Path
          allowed = {
            '.github/workflows/h1-c1-f0-archive-pr31-fixture-once.yml',
            '.github/workflows/h1-c1-f0-fixture-verify.yml',
            'qualification/h1_c1/immutable_fixture/IMMUTABLE_FIXTURE_CANDIDATE_SCOPE.md',
            'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE.json.xz',
            'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE_MANIFEST.json',
            'qualification/h1_c1/immutable_fixture/capture_pr31_fixture.py',
            'qualification/h1_c1/immutable_fixture/inspect_pr31_fixture.py',
            'qualification/h1_c1/immutable_fixture/test_pr31_fixture.py',
          }
          changed = Path('c1_immutable_fixture_evidence/source-diff.txt').read_text().splitlines()
          assert len(changed) == len(allowed), changed
          assert all(line.startswith('A\t') for line in changed), changed
          assert {line.split('\t', 1)[1] for line in changed} == allowed, changed
          PY
          printf '%s  %s\n' \
            'fc5a7df5928c3fb8aef2ba4af516dfbd32b42c0450ebef1051ad4fd7efebd17f' \
            'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE.json.xz' | sha256sum --check
          sha256sum --check qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256 \
            > c1_immutable_fixture_evidence/f0-original-hashes.txt
          python --version > c1_immutable_fixture_evidence/python-version.txt
          python -m pip freeze > c1_immutable_fixture_evidence/packages.txt
      - name: Inspect immutable PR31 archive without approving consumption
        shell: bash
        run: |
          set -euo pipefail
          python -B -m qualification.h1_c1.immutable_fixture.inspect_pr31_fixture --inspect-only \
            > c1_immutable_fixture_evidence/archived-storage-inspection.json
          python -B -m qualification.h1_c1.immutable_fixture.inspect_pr31_fixture \
            > c1_immutable_fixture_evidence/no-owner-approval-refusal.json && exit 1 || test "$?" -eq 3
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('c1_immutable_fixture_evidence')
          read=json.loads((base/'archived-storage-inspection.json').read_text())
          deny=json.loads((base/'no-owner-approval-refusal.json').read_text())
          assert read['status']=='CANDIDATE_STORAGE_INTEGRITY_PASS_NOT_AUTHORIZED_FOR_NATIVE'
          assert read['archivedRawSha256']=='0db511dd8dba023d16518667de256029cf3e073463ea21e2478aeac8afd1f368'
          assert read['archivedCanonicalSeal']=='d2b8e2ca8e1f929cac7b028dcc3f7d0b453921d193f877eb091e23ac70aa4ce9'
          assert read['samples']==4001 and read['channels']==37
          assert deny['status']=='REFUSED_NO_APPROVED_CANONICAL_FIXTURE'
          assert read['nativeQualified'] is False and read['nativeExecuted'] is False
          assert deny['nativeQualified'] is False and deny['nativeExecuted'] is False
          PY
      - name: Fresh negative-control tests against archive, manifest, and attempts to bypass HOLD
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_pr31_fixture -v \
            2>&1 | tee c1_immutable_fixture_evidence/archive-negative-tests.txt
      - name: Frozen original F0 H1 regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v \
            2>&1 | tee c1_immutable_fixture_evidence/f0-test-log.txt
      - name: Preserve checking-only evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-c1-pr31-immutable-fixture-verify-${{ github.sha }}
          path: c1_immutable_fixture_evidence/
          retention-days: 90
          if-no-files-found: warn
