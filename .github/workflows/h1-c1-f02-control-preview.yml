name: H1-C1 F02 native-control DESIGN PREVIEW (offline, non-executable)
on:
  push:
    branches:
      - qualification/h1-c1-f02-reference-bound-preview
  # All branch pushes run this: dependency-only edits must not silently bypass.
permissions:
  contents: read
concurrency:
  group: simheat-h1-c1-f02-design-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-nonexecuting:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact historical source and reference anchor without token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set pinned Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install only offline scientific checking dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Verify only five new F02 design paths; original frozen hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c1_f02_design_evidence
          git rev-parse HEAD > c1_f02_design_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > c1_f02_design_evidence/head-tree.txt
          git diff --name-status f7c69954490c8dcd48d152906e8e2a6d5699481d HEAD > c1_f02_design_evidence/f02-changes.txt
          git ls-files -z | xargs -0 sha256sum > c1_f02_design_evidence/sources.sha256
          sha256sum --check qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256 > c1_f02_design_evidence/frozen-implementation-pins.txt
          python --version > c1_f02_design_evidence/python.txt
          python -m pip freeze > c1_f02_design_evidence/packages.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            'qualification/h1_c1/f02/F02_CONTROL_PLAN_PREVIEW.json',
            'qualification/h1_c1/f02/offline_control_preflight.py',
            'qualification/h1_c1/f02/test_offline_control_preflight.py',
            'qualification/h1_c1/f02/F02_DESIGN_SCOPE.md',
            '.github/workflows/h1-c1-f02-control-preview.yml'
          }
          rows=Path('c1_f02_design_evidence/f02-changes.txt').read_text().splitlines()
          assert len(rows)==len(allowed),rows
          assert {row.split('\t',1)[1] for row in rows}==allowed
          assert all(row.startswith('A\t') for row in rows),rows
          PY
          printf '%s  %s\n' 'fc5a7df5928c3fb8aef2ba4af516dfbd32b42c0450ebef1051ad4fd7efebd17f' \
            'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE.json.xz' | sha256sum --check
          printf '%s  %s\n' '50467b138ed64cdb908f2c763bc777e6babf0bb04a0711568acc559112e66f84' \
            'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE_MANIFEST.json' | sha256sum --check
      - name: Bounded prospective F02 plan preview only; never omc or plan preparation
        shell: bash
        run: |
          set -euo pipefail
          python -B -m qualification.h1_c1.f02.offline_control_preflight design-preview-only \
            > c1_f02_design_evidence/nonexec-control-preview.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('c1_f02_design_evidence/nonexec-control-preview.json').read_text())
          assert x['status']=='F02_CONTROL_DESIGN_PREFLIGHT_PASS_NONEXECUTABLE'
          assert x['sourceIdentityPinsVerified']==23
          assert x['exportChannels']==37 and x['timeGridSamples']==4001
          assert x['integralHistories']==4 and x['publicRequests']==9
          assert x['reviewedReferenceSeal']=='d2b8e2ca8e1f929cac7b028dcc3f7d0b453921d193f877eb091e23ac70aa4ce9'
          for flag in ('compilerObserved','mslObserved','oneShotReservationAllocated',
                       'trustedReleaseRootComplete','nativePlanApproved',
                       'ownerNativeLaunchApproved','nativeExecuted','nativeQualified',
                       'referenceRegenerated','originalF0ReferencePassed100x',
                       'pr32CrossHostBitwiseRegenerationPassed'):
              assert x[flag] is False,flag
          PY
      - name: CLI refuses all native or owner-authorizing actions
        shell: bash
        run: |
          set -euo pipefail
          for action in execute prepare launch native approve materialize; do
            if python -B -m qualification.h1_c1.f02.offline_control_preflight "${action}" \
                > c1_f02_design_evidence/forbidden-${action}.stdout \
                2> c1_f02_design_evidence/forbidden-${action}.stderr; then
              echo "FAIL: execution or approval action not refused"; exit 1
            fi
          done
      - name: F02 control design negative regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.f02.test_offline_control_preflight -v \
            2>&1 | tee c1_f02_design_evidence/f02-tests.txt
      - name: Previously reviewed owner checking, binding and archive regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.option_a.test_offline_reference_consumer -v \
            2>&1 | tee c1_f02_design_evidence/option-a-consumer-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_option_a_binding_preflight -v \
            2>&1 | tee c1_f02_design_evidence/original-binding-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_pr31_fixture -v \
            2>&1 | tee c1_f02_design_evidence/archive-integrity-tests.txt
      - name: Original frozen F0 regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v \
            2>&1 | tee c1_f02_design_evidence/frozen-h1-tests.txt
      - name: Save all checking/negative evidence, even if refused
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-c1-f02-control-design-only-${{ github.sha }}
          path: c1_f02_design_evidence/
          retention-days: 90
          if-no-files-found: warn
