name: H3-04 teacher what-if — source-linked offline and real browser checks
on:
  push:
    branches:
      - h3/teacher-parameter-study-scope
    paths:
      - 'viewer/network/**'
      - 'docs/H3_04_TEACHER_WHATIF_SCOPE.md'
      - '.github/workflows/h3-teacher-whatif-ci.yml'
permissions:
  contents: read
concurrency:
  group: sim-heat-h3-whatif-${{ github.ref }}
  cancel-in-progress: true
jobs:
  whatif:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source with no retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install checking-only dependencies and browser runtime
        run: python -m pip install --no-cache-dir --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 playwright==1.57.0
      - name: Detect Chrome or install bounded Chromium
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif command -v chromium >/dev/null; then chromium --version
          else python -m playwright install --with-deps chromium; fi
      - name: Check actual H1 revision, archived preview, old viewer and new comparison in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h3_whatif_ci_evidence
          git rev-parse HEAD > h3_whatif_ci_evidence/head-sha.txt
          git ls-files -z | xargs -0 sha256sum > h3_whatif_ci_evidence/source.sha256
          python --version > h3_whatif_ci_evidence/python.txt
          node --version > h3_whatif_ci_evidence/node.txt
          python -m pip freeze > h3_whatif_ci_evidence/dependencies.txt
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee h3_whatif_ci_evidence/h1.log
          python -B -m unittest discover -s experiments/h1_spike/checks -v 2>&1 | tee h3_whatif_ci_evidence/analytic.log
          python -B -m unittest discover -s viewer/network/tests -p 'test_*.py' -v 2>&1 | tee h3_whatif_ci_evidence/adapter.log
          node --check viewer/network/compare_core.mjs
          node --check viewer/network/compare.mjs
          node --test viewer/network/tests/*.test.mjs 2>&1 | tee h3_whatif_ci_evidence/node.log
          python -B viewer/network/tests/browser_smoke.py --out h3_whatif_ci_evidence/screenshots 2>&1 | tee h3_whatif_ci_evidence/browser.log
          python -B -m h1 h1/cases/D2_K2/study.json --root h1/cases > h3_whatif_ci_evidence/revision-admission.json
          python -c "import json;d=json.load(open('h3_whatif_ci_evidence/revision-admission.json'));assert d['admitted'] and d['nativeExecuted'] is False and all(x['status']=='not_computed' for x in d['requests'])"
      - name: Retain original checks and desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h3-whatif-offline-browser-evidence-${{ github.sha }}
          path: h3_whatif_ci_evidence/
          if-no-files-found: warn
          retention-days: 30
