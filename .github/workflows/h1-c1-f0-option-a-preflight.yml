name: H1-C1 F0 Option A proposed reference binding (OFFLINE ONLY)
on:
  push:
    branches:
      - qualification/h1-c1-f0-owner-option-a-proposal
    paths:
      - 'qualification/h1_c1/immutable_fixture/option_a_binding_preflight.py'
      - 'qualification/h1_c1/immutable_fixture/test_option_a_binding_preflight.py'
      - 'qualification/h1_c1/immutable_fixture/OPTION_A_OWNER_DECISION_PROPOSAL.md'
      - '.github/workflows/h1-c1-f0-option-a-preflight.yml'
permissions:
  contents: read
concurrency:
  group: simheat-c1-option-a-proposal-${{ github.sha }}
  cancel-in-progress: false
jobs:
  offline-binding-not-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact historical candidate (no token persistence)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install offline historical F0 Python dependencies only
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Verify entirely additive proposal diff, archive identity and frozen sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c1_option_a_preflight_evidence
          git rev-parse HEAD > c1_option_a_preflight_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > c1_option_a_preflight_evidence/head-tree.txt
          git diff --name-status bf51e7721bca73720aa9b5f5f2de90defee821ec HEAD \
             > c1_option_a_preflight_evidence/proposal-diff.txt
          git ls-files -z | xargs -0 sha256sum > c1_option_a_preflight_evidence/source.sha256
          sha256sum --check qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256 \
             > c1_option_a_preflight_evidence/frozen-f0-hashes.txt
          python --version > c1_option_a_preflight_evidence/python.txt
          python -m pip freeze > c1_option_a_preflight_evidence/packages.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            '.github/workflows/h1-c1-f0-option-a-preflight.yml',
            'qualification/h1_c1/immutable_fixture/option_a_binding_preflight.py',
            'qualification/h1_c1/immutable_fixture/test_option_a_binding_preflight.py',
            'qualification/h1_c1/immutable_fixture/OPTION_A_OWNER_DECISION_PROPOSAL.md',
          }
          lines=Path('c1_option_a_preflight_evidence/proposal-diff.txt').read_text().splitlines()
          assert len(lines)==4,lines
          for line in lines:
              mode,path=line.split('\t',1)
              assert mode=='A' and path in allowed,line
          assert {line.split('\t',1)[1] for line in lines}==allowed
          PY
          printf '%s  %s\n' \
            'fc5a7df5928c3fb8aef2ba4af516dfbd32b42c0450ebef1051ad4fd7efebd17f' \
            'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE.json.xz' | sha256sum --check
          printf '%s  %s\n' \
            '50467b138ed64cdb908f2c763bc777e6babf0bb04a0711568acc559112e66f84' \
            'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE_MANIFEST.json' | sha256sum --check
      - name: Offline read-only reference/model/study binding (NOT permission)
        shell: bash
        run: |
          set -euo pipefail
          python -B -m qualification.h1_c1.immutable_fixture.option_a_binding_preflight audit-only \
            > c1_option_a_preflight_evidence/read-only-binding.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('c1_option_a_preflight_evidence/read-only-binding.json').read_text())
          assert x['status']=='CANDIDATE_REFERENCE_STUDY_BINDING_PASS_NOT_OWNER_APPROVED'
          assert x['sourceHistory']['sourcePinsVerified']==23
          assert x['publicRequests']==9 and x['matchedMandatoryExports']==37
          assert x['timeGridSamples']==4001 and x['flowIntegralHistories']==4
          assert x['checkedReferenceSeal']=='d2b8e2ca8e1f929cac7b028dcc3f7d0b453921d193f877eb091e23ac70aa4ce9'
          for k in ('ownerApprovedOptionA','authorizedForNative','nativeQualified',
                    'nativeExecuted','nativePlanCreated','crossHostBitwiseRegenerationPassed',
                    'originalFrozenF0Reference100xPass'):
              assert x[k] is False, k
          print('PASS: offline reference binding; native/owner gate stays closed')
          PY
      - name: Negative tests for non-approval, source drift and refusal
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_option_a_binding_preflight -v \
            2>&1 | tee c1_option_a_preflight_evidence/binding-regressions.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_pr31_fixture -v \
            2>&1 | tee c1_option_a_preflight_evidence/archival-regressions.txt
      - name: Original frozen F0 historical tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v \
            2>&1 | tee c1_option_a_preflight_evidence/f0-regressions.txt
      - name: Archive both success and refusal evidence (never native)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-c1-f0-option-a-binding-proposal-${{ github.sha }}
          path: c1_option_a_preflight_evidence/
          retention-days: 90
          if-no-files-found: warn
