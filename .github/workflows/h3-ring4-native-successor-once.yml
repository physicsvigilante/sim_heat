name: H3 Ring4 corrected successor — one-shot native diagnostic (unqualified)
on:
  push:
    branches:
      - experiment/h3-ring4-native-successor-once
    paths:
      - .github/workflows/h3-ring4-native-successor-once.yml

permissions:
  contents: read

concurrency:
  group: sim-heat-h3-ring4-native-successor-one-shot
  cancel-in-progress: false

jobs:
  ring4:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAN_PIN: 1edef5a420f986e08263d9043fe9471030d882158667885eacf3fa6e6cc003e5
    steps:
      - name: Checkout exact corrected case without retained GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pin Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Record exact commit and plan digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h3_ring4_native_ci_evidence
          git rev-parse HEAD > h3_ring4_native_ci_evidence/head-sha.txt
          sha256sum tools/h3_ring4_native_plan_v2.json > h3_ring4_native_ci_evidence/plan.sha256
          test "$(sha256sum tools/h3_ring4_native_plan_v2.json | cut -d' ' -f1)" = "$PLAN_PIN"
      - name: Install pinned offline checker dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Verify all 23 source pins and original H1 tests; seal independent reference before OMC
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/h1_native_batch.py prepare --plan tools/h3_ring4_native_plan_v2.json --pin "$PLAN_PIN" 2>&1 | tee h3_ring4_native_ci_evidence/prepare.log
      - name: Install OpenModelica 1.27.0 and Modelica Standard Library 4.0.0
        uses: OpenModelica/setup-openmodelica@419f31141aa79a22f7033def5626047dd3bb5069 # v1.2.0
        with:
          version: '1.27.0'
          packages: |
            omc
          libraries: |
            Modelica 4.0.0
      - name: One OMC version check, at most one build and model launch; no retry
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/h1_native_batch.py execute --plan tools/h3_ring4_native_plan_v2.json --pin "$PLAN_PIN" 2>&1 | tee h3_ring4_native_ci_evidence/execute.log
      - name: Archive actual original native evidence, source identities and failure data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h3-ring4-native-successor-evidence
          path: |
            h3_ring4_native_ci_evidence/
            h3_ring4_native_successor_attempt/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
