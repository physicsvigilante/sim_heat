name: Teacher unfamiliar dual-network H1 composition - OFFLINE only
on:
  push:
    branches: [teaching/t4-dual-network-composition]
  pull_request:
    branches: [teaching/t3-archived-diagnostic-hardening]
    paths:
      - experiments/teacher_dual_network/**
      - tests/test_teacher_dual_network.py
      - tests/browser_teacher_dual_network.py
      - .github/workflows/teacher-dual-network-ci.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: simheat-dual-network-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-dual-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install checker and browser dependencies ONLY - never OpenModelica
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 playwright==1.57.0
      - name: Use hosted Chrome or pinned Chromium fallback
        run: |
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif command -v chromium >/dev/null; then chromium --version
          else python -m playwright install --with-deps chromium; fi
      - name: Pin first task and source, six path scope, parent and preserved history
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dual_network_composition"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/checked-out-head.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/checked-out-tree.txt"
          base=ba625afe3223d4c0fda5d23b88445d08d64771c6
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "$(git rev-parse HEAD^1)" = "$base"
            test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
          fi
          git cat-file -e "${base}^{commit}"
          git diff --name-status "$base" HEAD > "$evidence/candidate-paths.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          evidence=Path(os.environ['RUNNER_TEMP'])/'dual_network_composition'
          actual=set((evidence/'candidate-paths.txt').read_text().splitlines())
          expected={
            'A\t.github/workflows/teacher-dual-network-ci.yml',
            'A\texperiments/teacher_dual_network/TASK.md',
            'A\texperiments/teacher_dual_network/model.mo',
            'A\texperiments/teacher_dual_network/study.json',
            'A\ttests/test_teacher_dual_network.py',
            'A\ttests/browser_teacher_dual_network.py',
          }
          assert actual==expected,(sorted(actual),sorted(expected))
          PY
          git diff --exit-code "$base" HEAD -- h1 qualification viewer tools docs .github/workflows/teacher-archive-handoff-ci.yml
          sha256sum experiments/teacher_dual_network/{TASK.md,model.mo,study.json} > "$evidence/original-author-file-hashes.txt"
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          p=Path('experiments/teacher_dual_network/model.mo')
          expected='aad202adb2fa7cd4f308fd602b37ece83b26ef2c1d652db49d49c97e92cab6a4'
          assert sha256(p.read_bytes()).hexdigest()==expected
          PY
          git archive --format=tar HEAD > "$evidence/source.tar"
          python -m pip freeze > "$evidence/packages.txt"
      - name: Reuse genuine H1 admission and generic source preview
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dual_network_composition"
          python -B -m h1 experiments/teacher_dual_network/study.json --root experiments/teacher_dual_network > "$evidence/actual-h1-admission.json"
          python -B -m h1.source_preview experiments/teacher_dual_network/study.json --root experiments/teacher_dual_network --out "$evidence/actual-source-preview.json"
      - name: Inherited regression suites plus new two-network and refusal tests
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dual_network_composition"
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee "$evidence/h1.log"
          python -B -m unittest discover -s experiments/h1_spike/checks -v 2>&1 | tee "$evidence/analytical.log"
          python -B -m unittest discover -s viewer/network/tests -p 'test_*.py' -v 2>&1 | tee "$evidence/adapters.log"
          python -B -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$evidence/product.log"
          node --test viewer/tests/*.test.mjs viewer/network/tests/*.test.mjs viewer/source_preview/core.test.mjs 2>&1 | tee "$evidence/javascript.log"
          python -B tools/render_product_docs.py --check 2>&1 | tee "$evidence/docs-parity.log"
          python -B -m h1.source_preview h1/cases/TEACH_SPLIT3/study.json --root h1/cases --out "$evidence/unchanged-source.json"
          cmp "$evidence/unchanged-source.json" viewer/source_preview/data/TEACH_SPLIT3.json
          python -B viewer/network/tools/build_compare_index.py --out "$evidence/unchanged-archive-index.json"
          cmp "$evidence/unchanged-archive-index.json" viewer/network/data/compare_index.json
      - name: Replay all six historical diagnostic records OFFLINE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sim_heat_original_archives"
          for id in 14152886226 14155084346 14204656273 14215520616 14153251022; do
            gh api "repos/physicsvigilante/sim_heat/actions/artifacts/$id/zip" > "$RUNNER_TEMP/sim_heat_original_archives/artifact-$id.zip"
          done
          python -B viewer/network/tools/replay_published_archives.py --archives "$RUNNER_TEMP/sim_heat_original_archives" > "$RUNNER_TEMP/dual_network_composition/original-archive-replay.json"
      - name: Real HTTP Chrome generic novel-case and inherited refusal journeys
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dual_network_composition"
          python -B tests/browser_teacher_dual_network.py --out "$evidence/dual-network-browser" 2>&1 | tee "$evidence/dual-network-browser.log"
          python -B tests/browser_authoring_workbench.py --out "$evidence/original-workbench-browser" 2>&1 | tee "$evidence/original-workbench-browser.log"
          python -B tests/browser_source_preview.py --out "$evidence/source-browser" 2>&1 | tee "$evidence/source-browser.log"
          python -B viewer/network/tests/browser_smoke.py --out "$evidence/historical-explorer" 2>&1 | tee "$evidence/historical-browser.log"
      - name: Preserve all evidence, including failed first attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teacher-dual-network-${{ github.sha }}
          path: ${{ runner.temp }}/dual_network_composition/
          retention-days: 90
          if-no-files-found: error
