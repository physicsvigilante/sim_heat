name: H3-05 campaign receipt refusal regressions — offline and browser
on:
  push:
    branches:
      - h3/campaign-repin-negative-suite
    paths:
      - 'viewer/network/tests/test_campaign_repin.py'
      - 'docs/H3_05_CAMPAIGN_REPIN_SCOPE.md'
      - '.github/workflows/h3-campaign-repin-ci.yml'
permissions:
  contents: read
concurrency:
  group: sim-heat-h3-campaign-repin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  receipt-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install checking-only dependencies and real-browser testing tools
        run: python -m pip install --no-cache-dir --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 playwright==1.57.0
      - name: Select browser runtime for preserved UI checks
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif command -v chromium >/dev/null; then chromium --version
          else python -m playwright install --with-deps chromium; fi
      - name: Run old H1 and all viewer checks plus fully SHA-repinned test-only campaigns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h3_campaign_repin_ci_evidence
          git rev-parse HEAD > h3_campaign_repin_ci_evidence/head-sha.txt
          git ls-files -z | xargs -0 sha256sum > h3_campaign_repin_ci_evidence/source.sha256
          python --version > h3_campaign_repin_ci_evidence/python-version.txt
          node --version > h3_campaign_repin_ci_evidence/node-version.txt
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee h3_campaign_repin_ci_evidence/h1.log
          python -B -m unittest discover -s experiments/h1_spike/checks -v 2>&1 | tee h3_campaign_repin_ci_evidence/analytic.log
          python -B -m unittest discover -s viewer/network/tests -p 'test_*.py' -v 2>&1 | tee h3_campaign_repin_ci_evidence/adapter-and-repin.log
          node --test viewer/network/tests/*.test.mjs 2>&1 | tee h3_campaign_repin_ci_evidence/node.log
          python -B viewer/network/tests/browser_smoke.py --out h3_campaign_repin_ci_evidence/screenshots 2>&1 | tee h3_campaign_repin_ci_evidence/browser.log
      - name: Archive source IDs, refusal results, test logs and browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h3-campaign-repin-evidence-${{ github.sha }}
          path: h3_campaign_repin_ci_evidence/
          if-no-files-found: warn
          retention-days: 30
