name: PR51 F01 typed steady/campaign provenance - OFFLINE original archives
on:
  push:
    branches: [audit/pr51-f01-typed-provenance]
  pull_request:
    branches: [audit/2026-11-17-core-corrections]
permissions:
  contents: read
  actions: read
concurrency:
  group: simheat-pr51-F01-typed-provenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned checking and browser dependencies, never OpenModelica
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 playwright==1.57.0
      - name: Select Chromium
        run: |
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif command -v chromium >/dev/null; then chromium --version
          else python -m playwright install --with-deps chromium; fi
      - name: Offline core and adversarial suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p typed_provenance_evidence
          git rev-parse HEAD > typed_provenance_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > typed_provenance_evidence/head-tree.txt
          git diff --name-status 52d693a748ad3709c99215bac0a5840a236937a6 HEAD > typed_provenance_evidence/source-diff.txt
          python - <<'PY'
          from pathlib import Path
          rows=Path('typed_provenance_evidence/source-diff.txt').read_text().splitlines()
          expected={
              'M\tviewer/network/tools/build_steady_case.py',
              'M\tviewer/network/tools/build_campaign_case.py',
              'A\tviewer/network/tests/test_provenance_integer_types.py',
              'A\tviewer/network/PR51_F01_TYPED_PROVENANCE_SCOPE.md',
              'A\t.github/workflows/pr51-f01-typed-provenance.yml',
          }
          assert set(rows)==expected and len(rows)==len(expected),rows
          PY
          python -m pip freeze > typed_provenance_evidence/packages.txt
          python -B -m unittest viewer.network.tests.test_provenance_integer_types -v 2>&1 | tee typed_provenance_evidence/targeted-F01-tests.log
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee typed_provenance_evidence/h1.log
          python -B -m unittest discover -s experiments/h1_spike/checks -v 2>&1 | tee typed_provenance_evidence/arithmetic.log
          python -B -m unittest discover -s viewer/network/tests -p 'test_*.py' -v 2>&1 | tee typed_provenance_evidence/adapters.log
          node --test viewer/tests/*.test.mjs viewer/network/tests/*.test.mjs 2>&1 | tee typed_provenance_evidence/node.log
          python -B viewer/network/tools/build_compare_index.py --out typed_provenance_evidence/compare-replayed.json
          cmp viewer/network/data/compare_index.json typed_provenance_evidence/compare-replayed.json
      - name: Replay untouched original native archives without executing their binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/original-archives
          for id in 14152886226 14155084346 14204656273 14215520616 14153251022; do
            gh api "repos/physicsvigilante/sim_heat/actions/artifacts/$id/zip" > "/tmp/original-archives/artifact-$id.zip"
          done
          python -B viewer/network/tools/replay_published_archives.py --archives /tmp/original-archives > typed_provenance_evidence/archive-replay.json
      - name: Existing full explorer Chromium interaction and refusal smoke
        shell: bash
        run: |
          set -euo pipefail
          python -B viewer/network/tests/browser_smoke.py --out typed_provenance_evidence/browser 2>&1 | tee typed_provenance_evidence/browser.log
      - name: Retain exact source, failures, original replay and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr51-F01-typed-provenance-${{ github.sha }}
          path: typed_provenance_evidence/
          retention-days: 90
          if-no-files-found: error
