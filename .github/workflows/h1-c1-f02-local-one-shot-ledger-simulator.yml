name: H1-C1 F02 local one-shot ledger SIMULATOR (OFFLINE, no native)
on:
  push:
    branches:
      - qualification/h1-c1-f02-one-shot-ledger-simulator
  # Intentionally no path filter: every dependency/source edit gets checked.
permissions:
  contents: read
concurrency:
  group: simheat-f02-LOCAL-LEDGER-DEMO-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pure-python-local-ledger-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact source with no credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin historical Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install offline numerical checking packages (NO Modelica)
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Check source diff and entire frozen F0 SHA inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c1_f02_one_shot_simulation_evidence
          git rev-parse HEAD > c1_f02_one_shot_simulation_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > c1_f02_one_shot_simulation_evidence/head-tree.txt
          git diff --name-status f87a9aa025caf5091da8fe3613734b62281ebe1c HEAD > c1_f02_one_shot_simulation_evidence/source-diff.txt
          git ls-files -z | xargs -0 sha256sum > c1_f02_one_shot_simulation_evidence/source.sha256
          sha256sum --check qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256 > c1_f02_one_shot_simulation_evidence/frozen-source-checks.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            '.github/workflows/h1-c1-f02-local-one-shot-ledger-simulator.yml',
            'qualification/h1_c1/f02/offline_one_shot_ledger_simulator.py',
            'qualification/h1_c1/f02/test_offline_one_shot_ledger_simulator.py',
            'qualification/h1_c1/f02/LOCAL_ONE_SHOT_LEDGER_SIMULATOR_SCOPE.md',
          }
          rows=Path('c1_f02_one_shot_simulation_evidence/source-diff.txt').read_text().splitlines()
          assert len(rows)==4,rows
          assert all(row.startswith('A\t') for row in rows),rows
          assert {row.split('\t',1)[1] for row in rows}==allowed,rows
          PY
          printf '%s  %s\n' 'fc5a7df5928c3fb8aef2ba4af516dfbd32b42c0450ebef1051ad4fd7efebd17f' 'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE.json.xz' | sha256sum --check
          printf '%s  %s\n' '50467b138ed64cdb908f2c763bc777e6babf0bb04a0711568acc559112e66f84' 'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE_MANIFEST.json' | sha256sum --check
          python --version > c1_f02_one_shot_simulation_evidence/python.txt
          python -m pip freeze > c1_f02_one_shot_simulation_evidence/packages.txt
      - name: Simulate ONE local SQLite slot, refuse duplicate, inspect read-only
        shell: bash
        run: |
          set -euo pipefail
          python -B -m qualification.h1_c1.f02.offline_one_shot_ledger_simulator simulate-local-only --label ci-localdemo > c1_f02_one_shot_simulation_evidence/first-simulated-slot.json
          if python -B -m qualification.h1_c1.f02.offline_one_shot_ledger_simulator simulate-local-only --label ci-localdemo > c1_f02_one_shot_simulation_evidence/second-refused-slot.json; then
            echo 'FAIL: second simulated local claim was accepted'; exit 1
          fi
          python -B -m qualification.h1_c1.f02.offline_one_shot_ledger_simulator inspect-local-only --label ci-localdemo > c1_f02_one_shot_simulation_evidence/readonly-inspection.json
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('c1_f02_one_shot_simulation_evidence')
          a=json.loads((root/'first-simulated-slot.json').read_text())
          b=json.loads((root/'second-refused-slot.json').read_text())
          c=json.loads((root/'readonly-inspection.json').read_text())
          assert a['status']=='SIMULATED_LOCAL_SLOT_CONSUMED_NOT_NATIVE'
          assert b['status']=='REFUSED_ALREADY_SIMULATED_LOCALLY'
          assert c['status']=='LOCAL_SIMULATED_SLOT_PRESENT_NOT_AUTHORITY'
          assert a['localDemoNonce']==b['localDemoNonce']==c['localDemoNonce']
          for doc in (a,b,c):
              assert doc['simulatedLocalSlotRecorded'] is True
              for flag in ('nativeAllowed','nativeExecuted','nativeQualified',
                           'realAcrossRunReservationAllocated','ownerNativeLaunchApproved',
                           'releaseTrustRootComplete','sharedAcrossHosts',
                           'nativeRunnerPresent','compilerQueried','buildInvoked',
                           'modelLaunched','referenceRegenerated',
                           'historicalF0Static100xPassed','pr32BitwiseRegenerationPassed'):
                  assert doc[flag] is False,flag
          assert a['referenceRawSha256']=='0db511dd8dba023d16518667de256029cf3e073463ea21e2478aeac8afd1f368'
          assert a['referenceSeal']=='d2b8e2ca8e1f929cac7b028dcc3f7d0b453921d193f877eb091e23ac70aa4ce9'
          print('PASS: only local SIMULATED lock, no real owner/native reservation')
          PY
          sha256sum c1_f02_one_shot_simulation_evidence/ci-localdemo.sqlite3 > c1_f02_one_shot_simulation_evidence/local-sqlite-sha.txt
      - name: Offline ten-process contention, crash and refusal tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.f02.test_offline_one_shot_ledger_simulator -v 2>&1 | tee c1_f02_one_shot_simulation_evidence/new-ledger-tests.txt
      - name: All previously reviewed offline preview and immutable source suites
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.f02.test_offline_build_script_preview -v 2>&1 | tee c1_f02_one_shot_simulation_evidence/build-text-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_stage_immutable_inputs -v 2>&1 | tee c1_f02_one_shot_simulation_evidence/staging-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_offline_control_preflight -v 2>&1 | tee c1_f02_one_shot_simulation_evidence/control-tests.txt
          python -B -m unittest qualification.h1_c1.option_a.test_offline_reference_consumer -v 2>&1 | tee c1_f02_one_shot_simulation_evidence/owner-consumer-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_option_a_binding_preflight -v 2>&1 | tee c1_f02_one_shot_simulation_evidence/binding-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_pr31_fixture -v 2>&1 | tee c1_f02_one_shot_simulation_evidence/archive-tests.txt
      - name: Original frozen 149 H1 regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee c1_f02_one_shot_simulation_evidence/frozen-h1-tests.txt
      - name: Archive local simulated database, negative receipts and preserved tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-c1-f02-local-ledger-simulator-${{ github.sha }}
          path: c1_f02_one_shot_simulation_evidence/
          if-no-files-found: warn
          retention-days: 90
