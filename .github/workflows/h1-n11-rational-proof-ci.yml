name: H1-N11 independent outward rational dynamic proof candidate - OFFLINE only
on:
  push:
    branches: [numerics/h1-n11-independent-rational-dynamics, numerics/h1-n11-reviewed-regressions]
  pull_request:
    branches: [numerics/h1-n10-dynamic-replay, numerics/h1-n11-independent-rational-dynamics]
    paths:
      - qualification/h1_n11/**
      - .github/workflows/h1-n11-rational-proof-ci.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: simheat-h1-n11-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-outward-rational:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install ONLY checker dependencies - no Modelica compiler, no OMC
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Pin reviewed N10 parent, four N11 additions and original physical facts
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/h1_n11"
          mkdir -p "$e"
          git rev-parse HEAD > "$e/checkout-head.txt"
          git rev-parse 'HEAD^{tree}' > "$e/checkout-tree.txt"
          base=1caea6afae55b3529c9818405d2ae669ea00be5c
          if [ "${{ github.event_name }}" = pull_request ]; then
            # PR78 targets reviewed PR77, while tests-only PR79 targets PR78.
            # The original N10 source fence below is unchanged and still
            # refuses ANY new fifth leaf path or modifications to N1-N10.
            test "$(git rev-parse HEAD^1)" = "${{ github.event.pull_request.base.sha }}"
            test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
          fi
          git cat-file -e "${base}^{commit}"
          git diff --name-status "$base" HEAD > "$e/changed-files.txt"
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import os
          e=Path(os.environ["RUNNER_TEMP"])/"h1_n11"
          expect={
            "A\t.github/workflows/h1-n11-rational-proof-ci.yml",
            "A\tqualification/h1_n11/README.md",
            "A\tqualification/h1_n11/rational_dynamic_proof.py",
            "A\tqualification/h1_n11/tests/test_rational_dynamic_proof.py",
          }
          assert set((e/"changed-files.txt").read_text().splitlines())==expect
          base=Path("qualification/h1_n1")
          for name,pin in {
            "reference-facts.json":"39f18db09fa618bc73bbe75ca40f33d41ded70a1c73865b2a0e376973d9adfbf",
            "inputs/T/model.mo":"2c60e40f1ad8d85f46968f03712d23e8cd6b9c656cf6099a38a97d198d0873ae",
            "inputs/T/study.json":"12ad51f59d2bd6c6561d4059f68b4263e7d4e39cdf5493f353a7affee6929d2a"
          }.items():
            assert sha256((base/name).read_bytes()).hexdigest()==pin
          PY
          git diff --exit-code "$base" HEAD -- h1 tools experiments docs viewer qualification/h1_c1 qualification/h1_n1 qualification/h1_n2 qualification/h1_n3 qualification/h1_n4 qualification/h1_n5 qualification/h1_n6 qualification/h1_n7 qualification/h1_n8 qualification/h1_n9 qualification/h1_n10
          git archive --format=tar HEAD > "$e/source.tar"
          python -m pip freeze > "$e/packages.txt"
      - name: N11 physical proof and negative controls, plus inherited N1-N10-H1 regressions
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/h1_n11"
          python -B -m unittest qualification.h1_n11.tests.test_rational_dynamic_proof -v 2>&1 | tee "$e/n11-tests.log"
          python -B -m unittest qualification.h1_n10.tests.test_dynamic_crosscheck -v 2>&1 | tee "$e/n10-tests.log"
          python -B -m unittest qualification.h1_n9.tests.test_static_trace_crosscheck -v 2>&1 | tee "$e/n9-tests.log"
          python -B -m unittest qualification.h1_n8.tests.test_corner_replay -v 2>&1 | tee "$e/n8-tests.log"
          python -B -m unittest qualification.h1_n7.tests.test_verified_junctions -v 2>&1 | tee "$e/n7-tests.log"
          python -B -m unittest qualification.h1_n6.tests.test_exact_junctions -v 2>&1 | tee "$e/n6-tests.log"
          python -B -m unittest qualification.h1_n5.tests.test_thermal_graph -v 2>&1 | tee "$e/n5-tests.log"
          python -B -m unittest qualification.h1_n4.tests.test_static_physical -v 2>&1 | tee "$e/n4-tests.log"
          python -B -m unittest qualification.h1_n3.tests.test_migration_plan -v 2>&1 | tee "$e/n3-tests.log"
          python -B -m unittest qualification.h1_n2.tests.test_compare -v 2>&1 | tee "$e/n2-tests.log"
          python -B -m unittest qualification.h1_n1.tests.test_certified_reference -v 2>&1 | tee "$e/n1-reference-tests.log"
          python -B -m unittest qualification.h1_n1.tests.test_plan -v 2>&1 | tee "$e/n1-plan-tests.log"
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee "$e/h1-tests.log"
          python -B tools/render_product_docs.py --check 2>&1 | tee "$e/docs-parity.log"
      - name: Preserve original seven physical precision failures and eight native blockers
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/h1_n11"
          python -B qualification/h1_n1/check_plan.py --out "$e/original-hold.json" > "$e/original-hold.stdout.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"h1_n11"/"original-hold.json").read_text())
          assert not x["nativeExecutionReady"] and not x["referenceAccuracyCertified"]
          assert x["nativeCallsThisCheck"]==0 and len(x["executionBlockers"])==8
          assert x["constantArithmetic"]["physical100xFailures"]==[
            "T02.G","T06.A","T06.G","T07.G","T08.G","T10.G","T_Plug.C"]
          PY
      - name: Repeat existing original N9 static and N10 numerical corroboration
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/h1_n11"
          python -B -m qualification.h1_n9.static_trace_crosscheck --out "$e/n9-repeat" > "$e/n9-repeat.log"
          python -B -m qualification.h1_n10.dynamic_crosscheck --out "$e/n10-repeat" > "$e/n10-repeat.log"
          python - <<'PY'
          import json,os
          from pathlib import Path
          e=Path(os.environ["RUNNER_TEMP"])/"h1_n11"
          n9=json.loads((e/"n9-repeat"/"n9-static-trace-crosscheck.json").read_text())
          n10=json.loads((e/"n10-repeat"/"n10-dynamic-crosscheck.json").read_text())
          assert n9["staticSampleComparisons"]==100828
          assert n10["totalOriginalSampleComparisons"]==648180
          assert not n9["independentFullGridPhysicalCertificate"]
          assert not n10["fullDynamicPhysical100xIndependentlyCertified"]
          assert not n10["nativeExecuted"] and not n10["referenceBundleWritten"]
          PY
      - name: Actually run N11 outward rational full-grid 77+8+5 mathematical bound checks
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/h1_n11"
          python -B -m qualification.h1_n11.rational_dynamic_proof --out "$e/n11-receipt" 2>&1 | tee "$e/n11-runtime.log"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"h1_n11"/"n11-receipt"/"n11-rational-proof-candidate.json").read_text())
          assert r["schema"]=="sim_heat.h1_n11.independent_rational_dynamic_enclosure_candidate/1"
          assert [x["samples"] for x in r["grids"]]==[2401,4801]
          assert r["individualPhysicallyEnclosedSamples"]==648180
          assert all(x["outwardRationalEnclosureSelfCheckPassed"] for x in r["grids"])
          assert all(x["verifiedStepProof"]["lastAffineRowPremiseChecked"] for x in r["grids"])
          for key in ("independentExternalMathematicalCertification",
            "fullDynamicPhysical100xIndependentlyCertified",
            "referenceAccuracyCertified","independentlyCertifiedReference",
            "runtimeReady","referenceBundleWritten","externalOwnerApprovalVerified",
            "nativeExecuted","nativeQualified","historicalReferenceRegenerated"):
            assert r[key] is False,key
          assert r["legacySevenStaticCheckingCentresStillFail"]==[
            "T02.G","T06.A","T06.G","T07.G","T08.G","T10.G","T_Plug.C"]
          PY
      - name: Preserve first refusal and completed source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-n11-independent-rational-${{ github.sha }}
          path: ${{ runner.temp }}/h1_n11/
          retention-days: 90
          if-no-files-found: error
