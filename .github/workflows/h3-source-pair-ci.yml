name: H3-06 source-pair provenance — H1 admission and Chromium regressions
on:
  push:
    branches:
      - h3/source-pair-provenance-v2
    paths:
      - 'viewer/network/**'
      - 'docs/H3_06_SOURCE_PAIR_PROVENANCE.md'
      - '.github/workflows/h3-source-pair-ci.yml'
permissions:
  contents: read
concurrency:
  group: sim-heat-h3-pair-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned checking-only and browser dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 playwright==1.57.0
      - name: Pin actual Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif command -v chromium >/dev/null; then chromium --version
          else python -m playwright install --with-deps chromium; fi
      - name: Verify exact derived source provenance, original thermal tests and real browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h3_pair_evidence
          git rev-parse HEAD > h3_pair_evidence/head-sha.txt
          git ls-files -z | xargs -0 sha256sum > h3_pair_evidence/source.sha256
          python --version > h3_pair_evidence/python.txt
          node --version > h3_pair_evidence/node.txt
          python -B viewer/network/tools/build_compare_index.py --out h3_pair_evidence/compare-index-replayed.json 2>&1 | tee h3_pair_evidence/source-pair-replay.log
          cmp viewer/network/data/compare_index.json h3_pair_evidence/compare-index-replayed.json
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee h3_pair_evidence/h1.log
          python -B -m unittest discover -s experiments/h1_spike/checks -v 2>&1 | tee h3_pair_evidence/analytic.log
          python -B -m unittest discover -s viewer/network/tests -p 'test_*.py' -v 2>&1 | tee h3_pair_evidence/adapters.log
          node --check viewer/network/compare_core.mjs
          node --check viewer/network/compare.mjs
          node --test viewer/network/tests/*.test.mjs 2>&1 | tee h3_pair_evidence/node.log
          python -B viewer/network/tests/browser_smoke.py --out h3_pair_evidence/screenshots 2>&1 | tee h3_pair_evidence/browser.log
      - name: Preserve original SHA, replay output, refusal and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h3-source-pair-evidence-${{ github.sha }}
          path: h3_pair_evidence/
          if-no-files-found: warn
          retention-days: 30
