name: H1 D1 D2 one-shot transient diagnostics

on:
  push:
    branches:
      - experiment/h1-cloud-transients-once
    paths:
      - .github/workflows/h1-transients-once.yml

permissions:
  contents: read

concurrency:
  group: sim-heat-h1-transients-one-shot
  cancel-in-progress: false

jobs:
  transients:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAN_PIN: 3ece2a2b2fb3b6910d74b006fcd425203f099136e4c93de2559474c7ea042ed2
    steps:
      - name: Checkout unchanged physical models and pinned checking path
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned checking dependencies on ephemeral runner
        run: python -m pip install --no-cache-dir --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Reproduce offline suite and seal both references before any native build
        run: python -B tools/h1_native_batch.py prepare --plan tools/h1_d1d2_plan.json --pin "$PLAN_PIN"
      - name: Set up OpenModelica 1.27.0 and MSL 4.0.0
        uses: OpenModelica/setup-openmodelica@419f31141aa79a22f7033def5626047dd3bb5069
        with:
          version: '1.27.0'
          packages: |
            omc
          libraries: |
            Modelica 4.0.0
      - name: Run D1 then D2 through the same adapter; stop on first failure
        run: python -B tools/h1_native_batch.py execute --plan tools/h1_d1d2_plan.json --pin "$PLAN_PIN"
      - name: Preserve all outputs and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-d1d2-transient-evidence
          path: h1_transient_attempt/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
