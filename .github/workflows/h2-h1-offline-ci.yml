name: H2 H1 integration offline verification

on:
  push:
    branches:
      - main
      - h2/h1-integration

permissions:
  contents: read

concurrency:
  group: h2-h1-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-h1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit (no persistent token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Install pinned offline dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-h1-ci.txt
      - name: Record source and runtime identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h2_ci_evidence
          git rev-parse HEAD > h2_ci_evidence/head-sha.txt
          git ls-files -z | xargs -0 sha256sum > h2_ci_evidence/source-files.sha256
          python -m pip freeze > h2_ci_evidence/dependencies.txt
          python --version > h2_ci_evidence/python.txt
      - name: Full H1 offline tests (no native compiler)
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee h2_ci_evidence/h1-tests.log
          python -B -m unittest discover -s experiments/h1_spike/checks -v 2>&1 | tee h2_ci_evidence/analytical-smoke.log
      - name: Admit preserved developer bridge without simulating
        shell: bash
        run: |
          set -euo pipefail
          python -B -m h1 h1/cases/DEV_BRIDGE/study.json --root h1/cases > h2_ci_evidence/bridge-admission.json
          python -c "import json; d=json.load(open('h2_ci_evidence/bridge-admission.json')); assert d['admitted'] and d['nativeExecuted'] is False"
      - name: Prepare checking-only reference with frozen verifier
        shell: bash
        run: |
          set -euo pipefail
          python -B -m h1.verify prepare \
            --study h1/cases/DEV_BRIDGE/study.json --root h1/cases \
            --reference experiments/dev_bridge/reference/DEV_BRIDGE.json \
            --out h2_ci_evidence/bridge-reference.bundle.json \
            > h2_ci_evidence/bridge-reference-prepare.json
          python -c "import json; r=json.load(open('h2_ci_evidence/bridge-reference-prepare.json')); b=json.load(open('h2_ci_evidence/bridge-reference.bundle.json')); assert r['seal']==b['seal']"
      - name: Preserve CI logs and exact checked-source identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h2-h1-offline-evidence-${{ github.sha }}
          path: h2_ci_evidence/
          if-no-files-found: warn
          retention-days: 30
