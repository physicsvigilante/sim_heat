name: H1-C1 F0 owner-adopted Option A offline reference checking (NO NATIVE)
on:
  push:
    branches:
      - qualification/h1-c1-f0-option-a-reference-adoption
  # Intentionally NO paths filter: any dependency-only push must check the new head.
permissions:
  contents: read
concurrency:
  group: simheat-c1-option-a-checking-branch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-bound-offline-reference-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source, all reviewed refs, no GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select pinned Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install checking-only dependencies, not Modelica
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Guard identity, source drift, owner record, and all changed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c1_option_a_adopted_evidence
          git rev-parse HEAD > c1_option_a_adopted_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > c1_option_a_adopted_evidence/head-tree.txt
          git diff --name-status 2f7fc7c0a43a786625abe2648eea0116ef3fd5f7 HEAD \
            > c1_option_a_adopted_evidence/owner-adoption-diff.txt
          git ls-files -z | xargs -0 sha256sum > c1_option_a_adopted_evidence/all-source.sha256
          sha256sum --check qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256 \
            > c1_option_a_adopted_evidence/14-frozen-implementation-pins.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            'qualification/h1_c1/option_a/OWNER_ADOPTION.json',
            'qualification/h1_c1/option_a/offline_reference_consumer.py',
            'qualification/h1_c1/option_a/test_offline_reference_consumer.py',
            'qualification/h1_c1/option_a/ADOPTION_SCOPE.md',
            '.github/workflows/h1-c1-f0-option-a-checking-adoption.yml',
          }
          lines=Path('c1_option_a_adopted_evidence/owner-adoption-diff.txt').read_text().splitlines()
          assert len(lines)==len(allowed),lines
          for row in lines:
              status,path=row.split('\t',1)
              assert status=='A' and path in allowed,row
          assert {row.split('\t',1)[1] for row in lines}==allowed
          PY
          test "$(git rev-parse refs/remotes/origin/qualification/h1-c1-f0-option-a-reviewed-reference-anchor)" = 'bf51e7721bca73720aa9b5f5f2de90defee821ec'
          test "$(git rev-parse bf51e7721bca73720aa9b5f5f2de90defee821ec^{tree})" = 'a4c1e1cdd247cb07990db672ad4c092e93933d83'
          printf '%s  %s\n' \
            'fc5a7df5928c3fb8aef2ba4af516dfbd32b42c0450ebef1051ad4fd7efebd17f' \
            'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE.json.xz' | sha256sum --check
          printf '%s  %s\n' \
            '50467b138ed64cdb908f2c763bc777e6babf0bb04a0711568acc559112e66f84' \
            'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE_MANIFEST.json' | sha256sum --check
          python --version > c1_option_a_adopted_evidence/python.txt
          python -m pip freeze > c1_option_a_adopted_evidence/packages.txt
      - name: Load exactly adopted reference for read-only checking, without native permission
        shell: bash
        run: |
          set -euo pipefail
          python -B -m qualification.h1_c1.option_a.offline_reference_consumer check-reference-only \
            > c1_option_a_adopted_evidence/approved-checking-only-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('c1_option_a_adopted_evidence/approved-checking-only-receipt.json').read_text())
          assert x['status']=='APPROVED_REFERENCE_DATA_OFFLINE_CHECKING_ONLY'
          assert x['referenceAnchor']['referenceAnchorCommit']=='bf51e7721bca73720aa9b5f5f2de90defee821ec'
          assert x['referenceSeal']=='d2b8e2ca8e1f929cac7b028dcc3f7d0b453921d193f877eb091e23ac70aa4ce9'
          assert x['matchedExports']==37 and x['timeGridSamples']==4001
          assert x['flowIntegralHistories']==4 and x['publicRequests']==9
          for key in ('nativeAllowed','nativeQualified','nativeExecuted',
                      'nativePlanApproved','productionMergeAllowed',
                      'ownerDirectionAuthenticatedOnGitHub','releaseTrustRootComplete',
                      'scientificRegenBitwiseCertified'):
              assert x[key] is False,key
          print('PASS: exact archived reference adopted for offline data checking ONLY')
          PY
      - name: No native/approval/execute command can be issued through this program
        shell: bash
        run: |
          set -euo pipefail
          for command in execute native launch prepare approve materialize; do
            if python -B -m qualification.h1_c1.option_a.offline_reference_consumer "$command" \
                > c1_option_a_adopted_evidence/forbidden-"${command}".stdout \
                2> c1_option_a_adopted_evidence/forbidden-"${command}".stderr; then
              echo "ERROR: forbidden owner/native command was accepted: $command"; exit 1
            fi
          done
      - name: New owner-decision/anchor/consumer adversarial regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.option_a.test_offline_reference_consumer -v \
            2>&1 | tee c1_option_a_adopted_evidence/adoption-negative-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_option_a_binding_preflight -v \
            2>&1 | tee c1_option_a_adopted_evidence/old-binding-regressions.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_pr31_fixture -v \
            2>&1 | tee c1_option_a_adopted_evidence/old-archive-regressions.txt
      - name: All original frozen historical H1 tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v \
            2>&1 | tee c1_option_a_adopted_evidence/frozen-h1-tests.txt
      - name: Archive exact-source offline evidence including refusals or failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-c1-owner-option-a-adopted-offline-${{ github.sha }}
          path: c1_option_a_adopted_evidence/
          if-no-files-found: warn
          retention-days: 90
