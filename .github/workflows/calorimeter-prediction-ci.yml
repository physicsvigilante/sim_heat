name: Offline thermal engine and viewer regressions
on:
  pull_request:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: >-
          python -m pip install --only-binary=:all: -r requirements-h1-ci.txt
      - name: Run top-level offline regression suite
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/head.txt
          python -B -m unittest discover -s tests -v 2>&1 | tee evidence/regression.log
      - name: Run H1, analytical and viewer regression suites
        run: |
          set -o pipefail
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee evidence/h1.log
          python -B -m unittest discover -s experiments/h1_spike/checks -v 2>&1 | tee evidence/analytical.log
          python -B -m unittest discover -s viewer/network/tests -v 2>&1 | tee evidence/adapter.log
          node --test viewer/tests/*.test.mjs viewer/network/tests/*.test.mjs viewer/source_preview/*.test.mjs 2>&1 | tee evidence/viewer.log
      - name: Replay three-bath calorimetry
        run: python -B -m tools.two_heater_calorimetry --study studies/three_terminal/star/study.json --root studies/three_terminal/star --facts studies/three_terminal/star/facts.json --facts-sha256 16c414cf443e389560056bb782ac3dea0ac75c40cf2ba103fa0de25bef18def0 --heaters first second --bath warm 21 23 --bath middle -58 -56 --predict > evidence/prediction.json
      - name: Replay interior rod probe
        run: python -B -m tools.rod_generation --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --generate facing 320 --probe facing 0.125 > evidence/probe.json
      - name: Infer uniform power from three thermometer bands
        run: python -B -m tools.three_thermometer_rod --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --rod facing --probe 0 380 380 --probe 0.5 374 376 --probe 1 350 350 > evidence/thermometers.json
      - name: Probe a wall exchanging radiation and convection
        run: python -B -m tools.powered_wall_surface --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --port cold --generate facing 320 --enclosure-k 300 --area-m2 0.2 --emissivity 1 --sigma 0.00000005 --air-k 450 --h-w-per-m2-k 13.5 --probe facing 0.5 > evidence/radiating-wall-probe.json
      - name: Cross-check a fourth thermometer
        run: python -B -m tools.three_thermometer_rod --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --rod facing --probe 0 379 381 --probe 0.5 374 376 --probe 1 349 351 --check 0.25 382 382 > evidence/fourth-thermometer.json
      - name: Balance radial conduction with opposing external heat exchanges
        run: python -B -m tools.radiating_radial_layers --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --port cold --inner-radius-m 0.1 --layer 0.2 2 --enclosure-k 280 --emissivity 0.8 --sigma 0.0000000567 --air-k 450 --h-w-per-m2-k 12 --radius-sensitivity > evidence/radial-air-film.json
      - name: Calibrate a film from an outer surface thermometer
        run: python -B -m tools.radial_film_calibration --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --port cold --inner-radius-m 0.1 --layer 0.2 2 --surface-k 359 361 --air-k 450 --enclosure-k 280 --emissivity 0.8 --sigma 0.0000000567 > evidence/radial-film-calibration.json
      - name: Identify convection and radiation from two trials
        run: python -B -m tools.two_environment_calibration --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --port cold --inner-radius-m 0.1 --layer 0.2 2 --sigma 0.0000000567 --trial 360 360 360 300 --trial 360 360 350 360 > evidence/two-environments.json
      - name: Choose a finite insulation size across the critical radius
        run: python -B -m tools.shell_size_selection --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --port cold --inner-radius-m 0.1 --coating-k 1 --radius-m 0.5 --radius-m 0.2 --radius-m 0.12 --limit-w 127 --enclosure-k 300 --emissivity 0 --sigma 0.0000000567 --cylinder-length-m 1 --air-k 280 --h-w-per-m2-k 5 > evidence/shell-sizing.json
      - name: Choose one stocked radius across exterior conditions
        run: python -B -m tools.shell_environments --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --port cold --inner-radius-m 0.1 --coating-k 1 --radius-m 0.12 --radius-m 0.2 --radius-m 0.5 --limit-w 127 --emissivity 0 --sigma 0.0000000567 --cylinder-length-m 1 --environment winter 280 5 280 --environment summer 483 5 483 > evidence/multi-environment-sizes.json
      - name: Measure melting through a radial shell
        run: python -B -m tools.radial_phase_bath --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --phase-port hot --surface-port cold --transition-k 273.15 --latent-heat-j-per-kg 334000 --solid-kg 0.02 --liquid-kg 0.03 --duration-s 120 --inner-radius-m 0.1 --layer 0.2 2 --enclosure-k 300 --emissivity 0.8 --sigma 0.0000000567 --air-k 293.15 --h-w-per-m2-k 10 > evidence/radial-phase-bath.json
      - name: Size radial insulation for a phase-change hold time
        run: python -B -m tools.phase_shell_sizing --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --phase-port hot --surface-port cold --transition-k 273.15 --latent-heat-j-per-kg 334000 --solid-kg 0.02 --liquid-kg 0.03 --hold-duration-s 260 --inner-radius-m 0.1 --coating-k 1 --radius-m 0.5 --radius-m 0.2 --radius-m 0.12 --enclosure-k 280 --emissivity 0 --sigma 0.0000000567 --cylinder-length-m 1 --air-k 293.15 --h-w-per-m2-k 5 > evidence/phase-shell-sizing.json
      - name: Track a radial phase bath through day and night stages
        run: python -B -m tools.radial_phase_exposure --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --phase-port hot --surface-port cold --transition-k 273.15 --latent-heat-j-per-kg 334000 --solid-kg 0.02 --liquid-kg 0.03 --inner-radius-m 0.1 --layer 0.2 2 --emissivity 0.8 --sigma 0.0000000567 --stage day 293.15 10 310 100 --stage night 253.15 8 240 120 > evidence/radial-phase-exposure.json
      - name: Calibrate an outer air film from timed ice melting
        run: python -B -m tools.phase_film_calibration --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --phase-port hot --surface-port cold --transition-k 273.15 --latent-heat-j-per-kg 334000 --solid-kg 0.02 --liquid-kg 0.03 --duration-s 120 --melted-kg 0.0095 0.0096 --inner-radius-m 0.1 --layer 0.2 2 --air-k 293.15 --enclosure-k 300 --emissivity 0.8 --sigma 0.0000000567 > evidence/phase-film-calibration.json
      - name: Size radial insulation across a day and night exposure schedule
        run: python -B -m tools.radial_exposure_sizing --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --phase-port hot --surface-port cold --transition-k 273.15 --latent-heat-j-per-kg 334000 --solid-kg 0.02 --liquid-kg 0.03 --inner-radius-m 0.1 --coating-k 1 --radius-m 0.5 --radius-m 0.2 --radius-m 0.12 --emissivity 0 --sigma 0.0000000567 --cylinder-length-m 1 --stage day 293.15 5 280 260 --stage night 253.15 5 250 200 > evidence/radial-exposure-sizing.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: calorimeter-${{ github.event.pull_request.head.sha }}
          path: evidence/
