name: Offline calorimeter predictions
on:
  pull_request:
    branches: [codex/portable-workbench-launch, codex/correlated-bath-prediction, codex/interior-rod-probe, codex/three-thermometer-rod, codex/radiating-wall-probe]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: >-
          python -m pip install --only-binary=:all: -r requirements-h1-ci.txt
      - name: Run top-level offline regression suite
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/head.txt
          python -B -m unittest discover -s tests -v 2>&1 | tee evidence/regression.log
      - name: Replay three-bath calorimetry
        run: python -B -m tools.two_heater_calorimetry --study studies/three_terminal/star/study.json --root studies/three_terminal/star --facts studies/three_terminal/star/facts.json --facts-sha256 16c414cf443e389560056bb782ac3dea0ac75c40cf2ba103fa0de25bef18def0 --heaters first second --bath warm 21 23 --bath middle -58 -56 --predict > evidence/prediction.json
      - name: Replay interior rod probe
        run: python -B -m tools.rod_generation --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --generate facing 320 --probe facing 0.125 > evidence/probe.json
      - name: Infer uniform power from three thermometer bands
        run: python -B -m tools.three_thermometer_rod --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --rod facing --probe 0 380 380 --probe 0.5 374 376 --probe 1 350 350 > evidence/thermometers.json
      - name: Probe a wall exchanging radiation and convection
        run: python -B -m tools.powered_wall_surface --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --port cold --generate facing 320 --enclosure-k 300 --area-m2 0.2 --emissivity 1 --sigma 0.00000005 --air-k 450 --h-w-per-m2-k 13.5 --probe facing 0.5 > evidence/radiating-wall-probe.json
      - name: Cross-check a fourth thermometer
        run: python -B -m tools.three_thermometer_rod --study studies/composite_wall/study.json --root studies/composite_wall --facts studies/composite_wall/facts.json --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b --rod facing --probe 0 379 381 --probe 0.5 374 376 --probe 1 349 351 --check 0.25 382 382 > evidence/fourth-thermometer.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: calorimeter-${{ github.event.pull_request.head.sha }}
          path: evidence/
