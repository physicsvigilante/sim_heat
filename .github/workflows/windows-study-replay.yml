name: Study-loader portability candidate
on:
  pull_request:
    branches: [codex/phase-exposure-sequence]
permissions:
  contents: read
jobs:
  product:
    if: github.head_ref == 'codex/windows-study-replay'
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen base and bounded successor
        shell: bash
        run: |
          set -euo pipefail
          base=b16004ff5f84a6d67b24e8681071d969cf83921e
          git diff --exit-code f05f6a8fbdfd5ac177a5441d22b40dda6bf8e0d4 "$base" -- h1 qualification ':!qualification/h1_n13/heldout'
          git diff --exit-code "$base" HEAD -- h1 qualification studies viewer docs ':!h1/study.py' ':!h1/tests/test_verification.py' ':!h1/tests/test_resolution_campaign.py'
          test "$(git rev-parse HEAD:h1/tests/test_resolution_campaign.py)" = 8871d79bdfc4408a46f4d318aa2a57b1a736ab1a
          test "$(git rev-parse HEAD:h1/tests/test_verification.py)" = dd69244a8b8a8fd109bc9289ea5e8d2f1bfb4ae1
          test "$(git rev-parse HEAD:h1/study.py)" = 8835bf20ad50f791592a94f9d6b124dcaf44a8fe
          git diff --exit-code 954cf65e1dffd04c706654418f30d891d1ccba57 HEAD -- qualification/h1_n13/heldout
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-h1-ci.txt
      - name: Replay all offline product tests
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > replay-head.txt
          python -B -m unittest discover -s tests -v 2>&1 | tee replay-tests.txt
      - name: Replay offline H1 core tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee replay-h1-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-replay-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: |
            replay-head.txt
            replay-tests.txt
            replay-h1-tests.txt
          if-no-files-found: error
