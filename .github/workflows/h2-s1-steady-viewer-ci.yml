name: H2-03S S1 steady explorer — native-data, offline and browser regressions
on:
  push:
    branches:
      - h2/s1-steady-source-viewer
    paths:
      - 'viewer/network/**'
      - 'docs/H2_03S_S1_STEADY_VIEWER_SCOPE.md'
      - '.github/workflows/h2-s1-steady-viewer-ci.yml'
permissions:
  contents: read
concurrency:
  group: sim-heat-s1-steady-viewer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  steady-viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install checking-only dependencies and browser automation
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 playwright==1.57.0
      - name: Detect Chromium or install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif command -v chromium >/dev/null; then chromium --version
          else python -m playwright install --with-deps chromium; fi
      - name: Run original H1, analytical, old viewer, steady and real-browser checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h2_s1_steady_ci_evidence
          git rev-parse HEAD > h2_s1_steady_ci_evidence/head-sha.txt
          git ls-files -z | xargs -0 sha256sum > h2_s1_steady_ci_evidence/source-files.sha256
          python --version > h2_s1_steady_ci_evidence/python.txt
          node --version > h2_s1_steady_ci_evidence/node.txt
          python -m pip freeze > h2_s1_steady_ci_evidence/dependencies.txt
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee h2_s1_steady_ci_evidence/h1-tests.log
          python -B -m unittest discover -s experiments/h1_spike/checks -v 2>&1 | tee h2_s1_steady_ci_evidence/analytical-tests.log
          python -B -m unittest discover -s viewer/network/tests -p 'test_*.py' -v 2>&1 | tee h2_s1_steady_ci_evidence/adapter-tests.log
          node --test viewer/network/tests/*.test.mjs 2>&1 | tee h2_s1_steady_ci_evidence/node-tests.log
          python -B viewer/network/tests/browser_smoke.py --out h2_s1_steady_ci_evidence/screenshots 2>&1 | tee h2_s1_steady_ci_evidence/browser.log
      - name: Preserve exact-head test logs, screenshots and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h2-s1-steady-viewer-evidence-${{ github.sha }}
          path: h2_s1_steady_ci_evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve exact source for read-only offline native-adapter reproduction
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h2-s1-steady-source-${{ github.sha }}
          path: |
            h1/
            viewer/network/
            experiments/h1_spike/SimHeat.mo
          if-no-files-found: error
          retention-days: 30
