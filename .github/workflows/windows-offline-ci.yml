name: Windows offline H1 admission and M03 composability CI - ZERO OMC
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: simheat-windows-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-offline-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned offline checking libraries only, never OpenModelica
        run: >-
          python -m pip install --only-binary=:all: -r requirements-h1-ci.txt
      - name: Verify Windows nested H1 admission, M03 composability, CI scope, and product docs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -B -m unittest tests/test_h1_windows_nested_paths.py tests/test_m03_physical_composability.py tests/test_m04_enthalpy_continuation.py tests/test_m05_lesson_loopback.py tests/test_m06_stefan_and_rod_generation.py tests/test_m07_radiative_transient.py tests/test_audit_ci_scope.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/render_product_docs.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify LF line endings on .gitattributes-pinned files on Windows checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bad = @(git ls-files --eol -- qualification/h1_n1/SOURCE-PINS.json AGENTS.md h1/study.py | Where-Object { $_ -notmatch "w/lf" })
          if ($bad.Count -gt 0) {
            Write-Error ("Expected w/lf on pinned files, got: " + ($bad -join "; "))
            exit 1
          }
