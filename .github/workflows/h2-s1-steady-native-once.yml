name: H2-03S S1 one-shot steady native diagnostic (unqualified)
on:
  push:
    branches:
      - experiment/h2-s1-steady-native-once
    paths:
      - .github/workflows/h2-s1-steady-native-once.yml

permissions:
  contents: read

concurrency:
  group: sim-heat-h2-s1-native-once
  cancel-in-progress: false

jobs:
  s1_steady:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAN_PIN: e824b0718d969483de1dc52b6562bf94c219eaadc7dc057659cd557f7c3c5283
    steps:
      - name: Checkout exact experimental commit, no retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned checking-only Python dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Verify 22 pinned source files and run full offline suite; seal reference BEFORE native work
        run: python -B tools/h1_native_batch.py prepare --plan tools/h2_s1_native_plan.json --pin "$PLAN_PIN"
      - name: Install OpenModelica 1.27.0 and Modelica Standard Library 4.0.0
        uses: OpenModelica/setup-openmodelica@419f31141aa79a22f7033def5626047dd3bb5069
        with:
          version: '1.27.0'
          packages: |
            omc
          libraries: |
            Modelica 4.0.0
      - name: One version query, one build, at most one launch; generic MAT/CSV verification
        run: python -B tools/h1_native_batch.py execute --plan tools/h2_s1_native_plan.json --pin "$PLAN_PIN"
      - name: Archive original data, stage status and any failure; no post-run writeback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h2-s1-steady-native-evidence
          path: h2_s1_native_attempt/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
