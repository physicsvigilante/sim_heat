name: H1-C1 F02 immutable INPUT staging (OFFLINE, no OMC)
on:
  push:
    branches:
      - qualification/h1-c1-f02-immutable-input-stage
  # No paths filter: reject dependency-only drift at the current source HEAD.
permissions:
  contents: read
concurrency:
  group: simheat-h1c1-f02-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-stage-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact historical source, no credentials persisted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install offline-only reference-checking dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Enforce focused diff and frozen source pins before staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c1_f02_stage_evidence
          git rev-parse HEAD > c1_f02_stage_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > c1_f02_stage_evidence/head-tree.txt
          git diff --name-status 7cfa35a1cd5cc858e48bcdc4da453bf2dc22b7f2 HEAD > c1_f02_stage_evidence/focused-diff.txt
          git ls-files -z | xargs -0 sha256sum > c1_f02_stage_evidence/source.sha256
          sha256sum --check qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256 > c1_f02_stage_evidence/old-f0-shas.txt
          python --version > c1_f02_stage_evidence/python.txt
          python -m pip freeze > c1_f02_stage_evidence/packages.txt
          python - <<'PY'
          from pathlib import Path
          modified={
              'qualification/h1_c1/f02/offline_control_preflight.py',
              'qualification/h1_c1/f02/test_offline_control_preflight.py',
          }
          added={
              'qualification/h1_c1/f02/stage_immutable_inputs.py',
              'qualification/h1_c1/f02/test_stage_immutable_inputs.py',
              'qualification/h1_c1/f02/IMMUTABLE_INPUT_STAGE_SCOPE.md',
              '.github/workflows/h1-c1-f02-immutable-input-stage.yml',
          }
          rows=Path('c1_f02_stage_evidence/focused-diff.txt').read_text().splitlines()
          assert len(rows)==6,rows
          status={p:s for s,p in (row.split('\t',1) for row in rows)}
          assert status=={**{p:'M' for p in modified},**{p:'A' for p in added}},status
          PY
          printf '%s  %s\n' \
              'fc5a7df5928c3fb8aef2ba4af516dfbd32b42c0450ebef1051ad4fd7efebd17f' \
              'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE.json.xz' | sha256sum --check
          printf '%s  %s\n' \
              '50467b138ed64cdb908f2c763bc777e6babf0bb04a0711568acc559112e66f84' \
              'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE_MANIFEST.json' | sha256sum --check
      - name: Fresh offline stage exact original bytes, not a native plan
        shell: bash
        run: |
          set -euo pipefail
          python -B -m qualification.h1_c1.f02.stage_immutable_inputs stage-offline-only --label ci-original \
            > c1_f02_stage_evidence/staging-receipt.json
          python -B -m qualification.h1_c1.f02.stage_immutable_inputs verify-offline-only --label ci-original \
            > c1_f02_stage_evidence/staging-readback.json
          python - <<'PY'
          import json
          from pathlib import Path
          parent=Path('c1_f02_stage_evidence')
          x=json.loads((parent/'staging-receipt.json').read_text())
          y=json.loads((parent/'staging-readback.json').read_text())
          assert x==y and x['status']=='OFFLINE_STAGED_EXACT_INPUTS_NOT_NATIVE'
          assert x['fileCount']==4
          assert x['referenceRawSha256']=='0db511dd8dba023d16518667de256029cf3e073463ea21e2478aeac8afd1f368'
          for name in ('nativeAllowed','nativeExecuted','nativePlanCreated',
                       'ownerNativeLaunchApproved','oneShotReservationAllocated',
                       'referenceRegenerated','originalF0Static100xPassed',
                       'pr32CrossHostBitwiseRegenerationPassed'):
              assert x[name] is False,name
          stage=parent/'ci-original'
          for forbidden in ('build.mos','model_res.mat','run.sh','model.exe','model'):
              assert not (stage/forbidden).exists(),forbidden
          print('PASS: staged only model/study/library and exact reviewed PR31 raw scientific bytes')
          PY
      - name: No native/approval/reservation/execute CLI actions
        shell: bash
        run: |
          set -euo pipefail
          for action in execute build launch native approve reserve run; do
            if python -B -m qualification.h1_c1.f02.stage_immutable_inputs "$action" --label ci-extra \
                > c1_f02_stage_evidence/denied-${action}.stdout \
                2> c1_f02_stage_evidence/denied-${action}.stderr; then
              echo "FAIL: forbidden native action unexpectedly succeeded"; exit 1
            fi
          done
      - name: Fresh staging and PR36 numeric-type negative regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.f02.test_stage_immutable_inputs -v \
            2>&1 | tee c1_f02_stage_evidence/new-staging-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_offline_control_preflight -v \
            2>&1 | tee c1_f02_stage_evidence/strict-type-and-preview-tests.txt
      - name: Prior reviewed offline consumer/binding/archive regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.option_a.test_offline_reference_consumer -v \
            2>&1 | tee c1_f02_stage_evidence/option-a-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_option_a_binding_preflight -v \
            2>&1 | tee c1_f02_stage_evidence/binding-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_pr31_fixture -v \
            2>&1 | tee c1_f02_stage_evidence/archive-tests.txt
      - name: All original frozen H1 regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v \
            2>&1 | tee c1_f02_stage_evidence/frozen-tests.txt
      - name: Archive partial and refused evidence as well as successful offline stage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-c1-f02-immutable-input-stage-${{ github.sha }}
          path: c1_f02_stage_evidence/
          if-no-files-found: warn
          retention-days: 90
