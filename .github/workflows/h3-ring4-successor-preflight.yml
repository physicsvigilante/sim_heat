name: H3 ring4 corrected successor — offline-only native preflight
on:
  push:
    branches:
      - experiment/h3-ring4-native-successor-once
    paths:
      - .github/workflows/h3-ring4-successor-preflight.yml
permissions:
  contents: read
jobs:
  source-pinned-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAN_PIN: 1edef5a420f986e08263d9043fe9471030d882158667885eacf3fa6e6cc003e5
    steps:
      - name: Checkout exact successor candidate without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install checking-only pinned dependencies (no OMC)
        run: python -m pip install --no-cache-dir --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Full plan hash and input pins, H1 regression suite and presealed reference (NO native build)
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/h1_native_batch.py prepare --plan tools/h3_ring4_native_plan_v2.json --pin "$PLAN_PIN"
          python -c "import json; a=json.load(open('h3_ring4_native_successor_attempt/attempt.json')); assert a['status']=='prepared' and a['counts']=={'versionQueries':0,'buildModelCalls':0,'modelLaunches':0} and len(a['cases'])==1 and a['cases'][0]['model']=='TeacherRingFour'"
      - name: Archive successful or refused preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h3-ring4-successor-preflight-${{ github.sha }}
          path: h3_ring4_native_successor_attempt/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
