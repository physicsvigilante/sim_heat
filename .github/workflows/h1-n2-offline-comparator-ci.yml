name: H1-N2 checking-only primary/companion diagnostics - NEVER native
on:
  push:
    branches: [checking/h1-n2-primary-companion-v1]
  pull_request:
    branches: [numerics/h1-n1-reference-v1]
    paths:
      - qualification/h1_n2/**
      - .github/workflows/h1-n2-offline-comparator-ci.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: simheat-h1-n2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install offline numerical checker libraries ONLY
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Exact scope and original model/study identity - no compiler
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/n2_companion_evidence"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/head-sha.txt"
          git rev-parse HEAD^{tree} > "$evidence/head-tree.txt"
          base=29bc126967d180e7f92b0a8bc29f50ee17608eb7
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "$(git rev-parse HEAD^1)" = "$base"
            test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
          fi
          git diff --name-status "$base" HEAD > "$evidence/source-diff.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          proof=Path(os.environ['RUNNER_TEMP'])/'n2_companion_evidence'
          actual=set((proof/'source-diff.txt').read_text().splitlines())
          expected={
              'A\tqualification/h1_n2/compare.py',
              'A\tqualification/h1_n2/README.md',
              'A\tqualification/h1_n2/tests/test_compare.py',
              'A\t.github/workflows/h1-n2-offline-comparator-ci.yml'}
          assert actual == expected,(actual,expected)
          src=Path('qualification/h1_n1/inputs/T')
          assert hashlib.sha256((src/'model.mo').read_bytes()).hexdigest()=='2c60e40f1ad8d85f46968f03712d23e8cd6b9c656cf6099a38a97d198d0873ae'
          assert hashlib.sha256((src/'study.json').read_bytes()).hexdigest()=='12ad51f59d2bd6c6561d4059f68b4263e7d4e39cdf5493f353a7affee6929d2a'
          assert hashlib.sha256(Path('qualification/h1_n1/reference-facts.json').read_bytes()).hexdigest()=='39f18db09fa618bc73bbe75ca40f33d41ded70a1c73865b2a0e376973d9adfbf'
          PY
          git diff --exit-code "$base" HEAD -- h1 tools experiments viewer docs qualification/h1_c1 qualification/h1_n1
          git archive --format=tar HEAD > "$evidence/source.tar"
          python -m pip freeze > "$evidence/packages.txt"
      - name: Adversarial synthetic diagnostics and inherited offline regression
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/n2_companion_evidence"
          python -B -m unittest qualification.h1_n2.tests.test_compare -v 2>&1 | tee "$evidence/new-comparator-tests.log"
          python -B -m unittest qualification.h1_n1.tests.test_certified_reference -v 2>&1 | tee "$evidence/inherited-n1-interval-tests.log"
          python -B -m unittest qualification.h1_n1.tests.test_plan -v 2>&1 | tee "$evidence/inherited-n1-plan-tests.log"
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee "$evidence/inherited-h1-tests.log"
          python -B tools/render_product_docs.py --check 2>&1 | tee "$evidence/docs-parity.log"
          python -B qualification/h1_n1/check_plan.py --out "$evidence/old-n1-refusal.json" > "$evidence/old-n1-refusal.stdout.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'n2_companion_evidence/old-n1-refusal.json'
          old=json.loads(p.read_text())
          assert old['nativeCallsThisCheck']==0
          assert old['nativeExecutionReady'] is False and old['referenceAccuracyCertified'] is False
          assert len(old['executionBlockers'])==8
          assert old['constantArithmetic']['physical100xFailures']==[
              'T02.G','T06.A','T06.G','T07.G','T08.G','T10.G','T_Plug.C']
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h1-n2-offline-${{ github.sha }}
          path: ${{ runner.temp }}/n2_companion_evidence/
          retention-days: 90
          if-no-files-found: error
