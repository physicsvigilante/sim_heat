name: Composite wall offline conduction
on:
  pull_request:
    branches: [codex/general-h1-reference]
permissions:
  contents: read
jobs:
  wall:
    if: github.head_ref == 'codex/composite-wall-study'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-h1-ci.txt
      - run: python -B -m unittest -v tests.test_composite_wall
      - name: Replay through the general conduction CLI
        run: |
          dir=studies/composite_wall
          python -B -m qualification.h1_n13.conduction --root "$dir" --study "$dir/study.json" --facts "$dir/facts.json" --facts-sha256 f4687ad77987ba5b5452d19b4c3aaa7a17ee3ab2320b8b8a3ddca73b177b4d5b > wall-output.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: composite-wall-${{ github.event.pull_request.head.sha }}
          path: wall-output.json
