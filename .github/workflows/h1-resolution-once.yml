name: H1 conductivity revision and resolution diagnostics

on:
  push:
    branches:
      - experiment/h1-cloud-resolution-once
    paths:
      - .github/workflows/h1-resolution-once.yml

permissions:
  contents: read

concurrency:
  group: sim-heat-h1-resolution-one-shot
  cancel-in-progress: false

jobs:
  resolution:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CAMPAIGN_PIN: d5a69dd2db5b2898c328a3b15a4c3b4ba2bf393f50838042bd9f41d6f3592186
    steps:
      - name: Checkout unchanged physics and checking path
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned checking dependencies on ephemeral runner
        run: python -m pip install --no-cache-dir --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Prepare isolated companion data and seal all seven references
        run: python -B tools/h1_resolution_campaign.py prepare --config tools/h1_resolution_campaign.json --pin "$CAMPAIGN_PIN"
      - name: Set up OpenModelica 1.27.0 and MSL 4.0.0
        uses: OpenModelica/setup-openmodelica@419f31141aa79a22f7033def5626047dd3bb5069
        with:
          version: '1.27.0'
          packages: |
            omc
          libraries: |
            Modelica 4.0.0
      - name: Seven planned runs through unchanged bounded runner; stop on first error
        run: python -B tools/h1_resolution_campaign.py execute --config tools/h1_resolution_campaign.json --pin "$CAMPAIGN_PIN"
      - name: Preserve inputs raw outputs and all failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-conductivity-resolution-evidence
          path: h1_resolution_attempt/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
