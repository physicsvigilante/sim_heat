name: H3 ring4 one-shot native demonstration (diagnostic only)
on:
  push:
    branches:
      - experiment/h3-ring4-native-once
    paths:
      - .github/workflows/h3-ring4-native-once.yml
permissions:
  contents: read
concurrency:
  group: sim-heat-h3-ring4-native-one-shot
  cancel-in-progress: false
jobs:
  ring4:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAN_PIN: 6e3aeb26854cb187e6108b14439aef874271f705c96092c16cb047a978965595
    steps:
      - name: Checkout exact original case without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install checking-only Python dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Verify complete input pins, H1 regressions and preseal ring4 reference BEFORE native work
        run: python -B tools/h1_native_batch.py prepare --plan tools/h3_ring4_native_plan.json --pin "$PLAN_PIN"
      - name: Set up OpenModelica 1.27.0 and Modelica 4.0.0
        uses: OpenModelica/setup-openmodelica@419f31141aa79a22f7033def5626047dd3bb5069
        with:
          version: '1.27.0'
          packages: |
            omc
          libraries: |
            Modelica 4.0.0
      - name: One explicit version query, one build, one launch maximum, no retry
        run: python -B tools/h1_native_batch.py execute --plan tools/h3_ring4_native_plan.json --pin "$PLAN_PIN"
      - name: Preserve original native evidence and all failed-stage output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h3-ring4-one-shot-native-evidence
          path: h3_ring4_native_attempt/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
