name: H1-C1 F0 F-01 strict static rounding audit (offline only)
on:
  push:
    branches:
      - qualification/h1-c1-f0-f01-rounding-audit
    paths:
      - 'qualification/h1_c1/evaluation/audit_f01_static_rounding.py'
      - 'qualification/h1_c1/evaluation/F01_STATIC_REFERENCE_DISPOSITION.md'
      - '.github/workflows/h1-c1-f0-f01-audit.yml'
permissions:
  contents: read
concurrency:
  group: simheat-h1-c1-f01-${{ github.sha }}
  cancel-in-progress: false
jobs:
  offline-f01:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact historical F0 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install checking dependencies only, no OpenModelica
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0
      - name: Original F0 hashes and original first-author inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c1_f01_audit_evidence
          git rev-parse HEAD > c1_f01_audit_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > c1_f01_audit_evidence/head-tree.txt
          git diff --name-status baabeb3ed176f4d9fa83d6be09a58b4f21fa8319 HEAD > c1_f01_audit_evidence/diff-from-pr28-head.txt
          git ls-files -z | xargs -0 sha256sum > c1_f01_audit_evidence/source.sha256
          sha256sum --check qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256 > c1_f01_audit_evidence/f0-frozen-pins.txt
          python --version > c1_f01_audit_evidence/python-version.txt
          python -m pip freeze > c1_f01_audit_evidence/python-packages.txt
          python - <<'PY'
          from pathlib import Path
          changes = Path('c1_f01_audit_evidence/diff-from-pr28-head.txt').read_text().splitlines()
          allow = {'qualification/h1_c1/evaluation/audit_f01_static_rounding.py',
                   'qualification/h1_c1/evaluation/F01_STATIC_REFERENCE_DISPOSITION.md',
                   '.github/workflows/h1-c1-f0-f01-audit.yml'}
          assert changes
          for item in changes:
              status, filename = item.split('\t',1)
              assert status == 'A' and filename in allow, item
          PY
      - name: Explicit regression reproduces 80x failure; no reference repair or OMC
        shell: bash
        run: |
          set -euo pipefail
          python -B -m qualification.h1_c1.evaluation.audit_f01_static_rounding > c1_f01_audit_evidence/F01_ROUNDING_AUDIT.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('c1_f01_audit_evidence/F01_ROUNDING_AUDIT.json').read_text())
          assert x['status']=='reproduced_strict_100x_failure'
          assert x['gate']=='HOLD_NO_NATIVE_EXECUTION'
          assert x['nativeExecuted'] is False
          assert x['referenceModified'] is False
          assert x['referenceExceptionGranted'] is False
          assert x['checkedSourcePins']==23
          assert x['gridPoints']==4001 and x['referenceChannels']==37
          assert x['originalSealedFloat']['strict100xPass'] is False
          assert x['originalSealedFloat']['marginTimes']==80
          assert x['hypotheticalNearestBinary64']['marginTimes']==320
          assert x['negativeUpperNeighborControl']['strict100xPass'] is False
          print('PASS: reproduced negative static reference result; native gate remains HOLD')
          PY
      - name: Unchanged frozen H1 regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee c1_f01_audit_evidence/f0-test-log.txt
      - name: Archive evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-c1-f01-rounding-audit-${{ github.sha }}
          path: c1_f01_audit_evidence/
          if-no-files-found: warn
          retention-days: 90
