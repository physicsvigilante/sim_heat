name: H1-C1 F02 hypothetical protocol model checker (OFFLINE, NO OMC)
on:
  push:
    branches:
      - qualification/h1-c1-f02-protocol-model-checker-offline
  # No paths filter: changes in inherited source must be visible to full CI.
permissions:
  contents: read
concurrency:
  group: simheat-h1c1-f02-HYPOTHETICAL-state-model-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-only-no-actual-owner-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact historic source without persisted GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Python 3.13.5 for frozen scientific regressions
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install Python scientific-checking deps only, NO OpenModelica
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Check exact four additions and all frozen source/reference pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c1_f02_hypothetical_protocol_evidence
          git rev-parse HEAD > c1_f02_hypothetical_protocol_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > c1_f02_hypothetical_protocol_evidence/head-tree.txt
          git diff --name-status 47be71571e5cfdf12a5576ebe6f18db355d2dc4b HEAD > c1_f02_hypothetical_protocol_evidence/source-diff.txt
          git ls-files -z | xargs -0 sha256sum > c1_f02_hypothetical_protocol_evidence/source.sha256
          sha256sum --check qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256 > c1_f02_hypothetical_protocol_evidence/frozen-f0-pins.txt
          python - <<'PY'
          from pathlib import Path
          expected={
            '.github/workflows/h1-c1-f02-hypothetical-protocol-model-checker.yml',
            'qualification/h1_c1/f02/offline_one_shot_state_model.py',
            'qualification/h1_c1/f02/test_offline_one_shot_state_model.py',
            'qualification/h1_c1/f02/ONE_SHOT_STATE_MODEL_SCOPE.md',
          }
          rows=Path('c1_f02_hypothetical_protocol_evidence/source-diff.txt').read_text().splitlines()
          assert len(rows)==4,rows
          assert all(row.startswith('A\t') for row in rows),rows
          assert {row.split('\t',1)[1] for row in rows}==expected,rows
          PY
          printf '%s  %s\n' 'fc5a7df5928c3fb8aef2ba4af516dfbd32b42c0450ebef1051ad4fd7efebd17f' 'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE.json.xz' | sha256sum --check
          printf '%s  %s\n' '50467b138ed64cdb908f2c763bc777e6babf0bb04a0711568acc559112e66f84' 'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE_MANIFEST.json' | sha256sum --check
          python --version > c1_f02_hypothetical_protocol_evidence/python.txt
          python -m pip freeze > c1_f02_hypothetical_protocol_evidence/packages.txt
      - name: Bounded toy state graph with original real native gates still missing
        shell: bash
        run: |
          set -euo pipefail
          python -B -m qualification.h1_c1.f02.offline_one_shot_state_model check-hypothetical-only > c1_f02_hypothetical_protocol_evidence/bounded-check.json
          python -B -m qualification.h1_c1.f02.offline_one_shot_state_model demonstrate-crash-hold-only > c1_f02_hypothetical_protocol_evidence/crash-no-retry.json
          python -B -m qualification.h1_c1.f02.offline_one_shot_state_model demonstrate-outage-hold-only > c1_f02_hypothetical_protocol_evidence/outage-no-retry.json
          python -B -m qualification.h1_c1.f02.offline_one_shot_state_model demonstrate-split-brain-only > c1_f02_hypothetical_protocol_evidence/two-fresh-states.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('c1_f02_hypothetical_protocol_evidence')
          a=json.loads((p/'bounded-check.json').read_text())
          b=json.loads((p/'crash-no-retry.json').read_text())
          c=json.loads((p/'outage-no-retry.json').read_text())
          d=json.loads((p/'two-fresh-states.json').read_text())
          assert a['toyAtMostOnceInvariant'] is True
          assert a['modelStateCount']>8 and a['refusedToyTransitions']>8
          assert b['simulatedClaims']==[1,0,0] and b['retryRefusedInToy'] is True
          assert c['simulatedClaims']==[1,1,0] and c['restartRefusedInToy'] is True
          assert d['independentFictionalFirstClaims']==2
          assert d['realCrossHostUniquenessProved'] is False
          for report in (a,b,c,d):
              assert report['releaseBlocked'] is True
              assert report['ownerNativeAuthorized'] is False
              assert report['realAtomicExternalReservationPresent'] is False
              for budget in ('ownerNativeLaunchBudget','actualOmcVersionQueryBudget',
                             'actualModelBuildBudget','actualModelLaunchBudget','actualRetryBudget'):
                  assert type(report[budget]) is int and report[budget]==0,budget
              for flag in ('nativeAllowed','nativeExecuted','nativeQualified',
                           'compilerQueried','buildInvoked','modelLaunched',
                           'referenceRegenerated','originalF0Static100xPassed',
                           'pr32BitwiseRegenerationPassed'):
                  assert report[flag] is False,flag
          print('PASS: fictional model only; all real/native budgets ZERO and release HOLD')
          PY
      - name: Forbidden native executable actions rejected by pure model CLI
        shell: bash
        run: |
          set -euo pipefail
          for action in omc approve execute launch build native reserve-native retry reset-real-store prepare run; do
            if python -B -m qualification.h1_c1.f02.offline_one_shot_state_model "${action}" > c1_f02_hypothetical_protocol_evidence/refused-${action}.stdout 2> c1_f02_hypothetical_protocol_evidence/refused-${action}.stderr; then
              echo "FAIL: an actual/native action was admitted"; exit 1
            fi
          done
      - name: New fictional protocol model and attack regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.f02.test_offline_one_shot_state_model -v 2>&1 | tee c1_f02_hypothetical_protocol_evidence/state-model-tests.txt
      - name: All prior independently reviewed offline source/reference/governance tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.f02.test_offline_release_readiness_hold -v 2>&1 | tee c1_f02_hypothetical_protocol_evidence/readiness-HOLD-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_offline_external_cas_contract -v 2>&1 | tee c1_f02_hypothetical_protocol_evidence/default-deny-fake-cas-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_offline_one_shot_ledger_simulator -v 2>&1 | tee c1_f02_hypothetical_protocol_evidence/local-sqlite-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_offline_build_script_preview -v 2>&1 | tee c1_f02_hypothetical_protocol_evidence/build-TEXT-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_stage_immutable_inputs -v 2>&1 | tee c1_f02_hypothetical_protocol_evidence/staging-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_offline_control_preflight -v 2>&1 | tee c1_f02_hypothetical_protocol_evidence/disabled-plan-tests.txt
          python -B -m unittest qualification.h1_c1.option_a.test_offline_reference_consumer -v 2>&1 | tee c1_f02_hypothetical_protocol_evidence/owner-approved-offline-consumer-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_option_a_binding_preflight -v 2>&1 | tee c1_f02_hypothetical_protocol_evidence/reference-binding-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_pr31_fixture -v 2>&1 | tee c1_f02_hypothetical_protocol_evidence/archive-tests.txt
      - name: Retest original frozen 149 H1 offline regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee c1_f02_hypothetical_protocol_evidence/original-h1-tests.txt
      - name: Archive exact-head offline hypothetical statuses and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-c1-f02-hypothetical-protocol-${{ github.sha }}
          path: c1_f02_hypothetical_protocol_evidence/
          retention-days: 90
          if-no-files-found: warn
