name: Offline qualification modules (N1-N13) maintenance CI - ZERO OMC
on:
  pull_request:
    branches: [main]
    paths:
      - qualification/h1_n*/**
      - h1/**
      - tools/verify_n1_plan_maintenance.py
      - .github/workflows/qualification-offline-ci.yml
permissions:
  contents: read
concurrency:
  group: simheat-qual-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned offline checking libraries only, never OpenModelica
        run: python -m pip install --only-binary=:all: -r requirements-h1-ci.txt
      - name: Run N1 pinned-context plan/negative-control checks and N2-N13 offline suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qual_evidence
          git rev-parse HEAD > qual_evidence/head-sha.txt
          python -B tools/verify_n1_plan_maintenance.py --run-tests --out qual_evidence/n1-plan-check.json 2>&1 | tee qual_evidence/n1.log
          for suite in \
            qualification/h1_n2/tests \
            qualification/h1_n3/tests \
            qualification/h1_n4/tests \
            qualification/h1_n5/tests \
            qualification/h1_n6/tests \
            qualification/h1_n7/tests \
            qualification/h1_n8/tests \
            qualification/h1_n9/tests \
            qualification/h1_n10/tests \
            qualification/h1_n11/tests \
            qualification/h1_n12/tests
          do
            echo "=== $suite ==="
            python -B -m unittest discover -s "$suite" -v 2>&1 | tee -a qual_evidence/n2_to_n13.log
          done
          echo "=== qualification/h1_n13/test_conduction.py ==="
          python -B -m unittest qualification/h1_n13/test_conduction.py -v 2>&1 | tee -a qual_evidence/n2_to_n13.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-offline-${{ github.sha }}
          path: qual_evidence/
          retention-days: 90
          if-no-files-found: error
