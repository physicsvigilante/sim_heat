name: Frozen thermal inputs across checkouts
on:
  pull_request:
    branches: [codex/thermometer-crosscheck]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: >-
          python -m pip install --only-binary=:all: -r requirements-h1-ci.txt
      - name: Verify original author inputs against frozen manifest
        run: >-
          python -B -c "import json, hashlib; from pathlib import Path;
          pins = json.loads(Path('qualification/h1_n1/SOURCE-PINS.json').read_bytes())['inputSha256'];
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest() == h for p,h in pins.items())"
      - run: python -B -m unittest discover -s qualification/h1_n4/tests -v
