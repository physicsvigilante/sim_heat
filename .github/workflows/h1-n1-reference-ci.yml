name: H1-N1 offline interval reference candidate - NEVER native
on:
  push:
    branches: [numerics/h1-n1-reference-v1]
  pull_request:
    branches: [planning/h1-n1-t1t]
    paths:
      - qualification/h1_n1/certified_reference.py
      - qualification/h1_n1/tests/test_certified_reference.py
      - qualification/h1_n1/INTERVAL-REFERENCE-V1.md
      - .github/workflows/h1-n1-reference-ci.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: simheat-h1-n1-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-reference-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install checking libraries ONLY - no OMC/compiler/Modelica
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Exact source boundary, immutable originals and artifact identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n1_reference_evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/n1_reference_evidence/head-sha.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/n1_reference_evidence/head-tree.txt"
          base=58ca02b293f2afbd931ab7ad1832fc4e34df1574
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="$(git rev-parse HEAD^1)"
            test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
          fi
          test "$base" = 58ca02b293f2afbd931ab7ad1832fc4e34df1574
          printf '%s\n' "$base" > "$RUNNER_TEMP/n1_reference_evidence/scope-base-sha.txt"
          git diff --name-status "$base" HEAD > "$RUNNER_TEMP/n1_reference_evidence/source-diff.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          actual=Path(__import__('os').environ['RUNNER_TEMP'],'n1_reference_evidence','source-diff.txt').read_text().splitlines()
          expected={'A\tqualification/h1_n1/certified_reference.py',
                    'A\tqualification/h1_n1/tests/test_certified_reference.py',
                    'A\tqualification/h1_n1/INTERVAL-REFERENCE-V1.md',
                    'A\t.github/workflows/h1-n1-reference-ci.yml'}
          assert len(actual)==4 and set(actual)==expected,actual
          p=Path('qualification/h1_n1/inputs/T')
          assert hashlib.sha256((p/'model.mo').read_bytes()).hexdigest()=='2c60e40f1ad8d85f46968f03712d23e8cd6b9c656cf6099a38a97d198d0873ae'
          assert hashlib.sha256((p/'study.json').read_bytes()).hexdigest()=='12ad51f59d2bd6c6561d4059f68b4263e7d4e39cdf5493f353a7affee6929d2a'
          PY
          git diff --exit-code "$base" HEAD -- h1 tools experiments viewer docs qualification/h1_c1 qualification/h1_n1/inputs qualification/h1_n1/reference-facts.json qualification/h1_n1/plan.json qualification/h1_n1/check_plan.py qualification/h1_n1/tests/test_plan.py
          git archive --format=tar HEAD > "$RUNNER_TEMP/n1_reference_evidence/source.tar"
          python -m pip freeze > "$RUNNER_TEMP/n1_reference_evidence/packages.txt"
      - name: Negative interval checks and full-grid independent mathematical candidate
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_n1.tests.test_certified_reference -v 2>&1 | tee "$RUNNER_TEMP/n1_reference_evidence/new-interval-tests.log"
          python -B -m unittest qualification.h1_n1.tests.test_plan -v 2>&1 | tee "$RUNNER_TEMP/n1_reference_evidence/old-plan-tests.log"
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee "$RUNNER_TEMP/n1_reference_evidence/h1-baseline-tests.log"
          python -B tools/render_product_docs.py --check 2>&1 | tee "$RUNNER_TEMP/n1_reference_evidence/docs-parity.log"
          python -B qualification/h1_n1/check_plan.py --out "$RUNNER_TEMP/n1_reference_evidence/old-plan-check.json" > "$RUNNER_TEMP/n1_reference_evidence/old-plan-check.stdout.json"
          python -B -m qualification.h1_n1.certified_reference --intervals 2400 --out "$RUNNER_TEMP/n1_reference_evidence/primary" 2>&1 | tee "$RUNNER_TEMP/n1_reference_evidence/primary.log"
          python -B -m qualification.h1_n1.certified_reference --intervals 4800 --out "$RUNNER_TEMP/n1_reference_evidence/dense" 2>&1 | tee "$RUNNER_TEMP/n1_reference_evidence/dense.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'n1_reference_evidence'
          old=json.loads((root/'old-plan-check.json').read_text())
          assert old['nativeCallsThisCheck']==0 and not old['referenceAccuracyCertified'] and not old['nativeExecutionReady']
          assert len(old['executionBlockers'])==8
          assert old['constantArithmetic']['physical100xFailures']==['T02.G','T06.A','T06.G','T07.G','T08.G','T10.G','T_Plug.C']
          for sub,n in [('primary',2400),('dense',4800)]:
            h=json.loads((root/sub/f'N1_T1T_report_grid{n}.json').read_text())
            assert (h['samples'],h['allExports'],h['requests'],h['flowIntegrals'])==(n+1,77,8,5)
            assert h['mathematicalIntervalSelfCheckPassed'] and not h['independentlyCertifiedReference']
            assert not h['runtimeReady'] and not h['nativeExecuted'] and not h['nativeQualified']
            assert not h['originalCheckingCentresAdopted'] and not h['historicalReferenceRegenerated']
            assert h['staticCheckingPhysical100xRefusalsRetained']==old['constantArithmetic']['physical100xFailures']
            assert all(x['maxErrorToAllowanceFractionUpper']<=.01 for x in h['margin'].values())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h1-n1-reference-offline-${{ github.sha }}
          path: ${{ runner.temp }}/n1_reference_evidence/
          retention-days: 90
          if-no-files-found: error
