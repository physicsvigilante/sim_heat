name: Offline preview provenance and regression suites
on:
  pull_request:
    branches: [codex/calorimetry-predictions]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.revision == 'head' && github.event.pull_request.head.sha || github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: >-
          python -m pip install --only-binary=:all: -r requirements-h1-ci.txt playwright==1.57.0
      - name: Run all offline regression suites and record each result
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          status=0
          check() {
            local name="$1"
            shift
            "$@" > "evidence/$name.log" 2>&1 || { tail -60 "evidence/$name.log"; status=1; }
          }
          for suite in tests h1/tests experiments/h1_spike/checks viewer/network/tests qualification/h1_n{1..12}/tests qualification/h1_n13; do
            check "${suite//\//-}" python -B -m unittest discover -s "$suite" -v
          done
          check viewer-node node --test viewer/tests/*.test.mjs viewer/network/tests/*.test.mjs viewer/source_preview/*.test.mjs
          for script in viewer/network/tests/browser_smoke.py tests/browser_{source_preview,product_docs,authoring_workbench}.py; do
            name=$(basename "$script" .py)
            check "$name" python -B "$script" --out "evidence/$name"
          done
          check prediction python -B -m tools.two_heater_calorimetry --study studies/three_terminal/star/study.json --root studies/three_terminal/star --facts studies/three_terminal/star/facts.json --facts-sha256 16c414cf443e389560056bb782ac3dea0ac75c40cf2ba103fa0de25bef18def0 --heaters first second --bath warm 22 22 --bath middle -57 -57 --predict
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-${{ matrix.revision }}-${{ github.event.pull_request.head.sha }}
          path: evidence/
