name: Project audit core corrections - offline regressions and original archives
on:
  push:
    branches: [audit/2026-11-17-core-corrections]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: simheat-core-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned checking and browser dependencies, never OpenModelica
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 playwright==1.57.0
      - name: Select Chromium
        run: |
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif command -v chromium >/dev/null; then chromium --version
          else python -m playwright install --with-deps chromium; fi
      - name: Offline core and adversarial suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p core_audit_evidence
          git rev-parse HEAD > core_audit_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > core_audit_evidence/head-tree.txt
          git diff --name-status c06fb5395781482bd6bbe055d10bc10cdf3bba8d HEAD > core_audit_evidence/source-diff.txt
          python -m pip freeze > core_audit_evidence/packages.txt
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee core_audit_evidence/h1.log
          python -B -m unittest discover -s experiments/h1_spike/checks -v 2>&1 | tee core_audit_evidence/arithmetic.log
          python -B -m unittest discover -s viewer/network/tests -p 'test_*.py' -v 2>&1 | tee core_audit_evidence/adapters.log
          node --test viewer/tests/*.test.mjs viewer/network/tests/*.test.mjs 2>&1 | tee core_audit_evidence/node.log
          python -B viewer/network/tools/build_compare_index.py --out core_audit_evidence/compare-replayed.json
          cmp viewer/network/data/compare_index.json core_audit_evidence/compare-replayed.json
      - name: Replay untouched original native archives without executing their binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/original-archives
          for id in 14152886226 14155084346 14204656273 14215520616 14153251022; do
            gh api "repos/physicsvigilante/sim_heat/actions/artifacts/$id/zip" > "/tmp/original-archives/artifact-$id.zip"
          done
          python -B viewer/network/tools/replay_published_archives.py --archives /tmp/original-archives > core_audit_evidence/archive-replay.json
      - name: Existing full explorer Chromium interaction and refusal smoke
        shell: bash
        run: |
          set -euo pipefail
          python -B viewer/network/tests/browser_smoke.py --out core_audit_evidence/browser 2>&1 | tee core_audit_evidence/browser.log
      - name: Retain exact source, failures, original replay and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-project-audit-${{ github.sha }}
          path: core_audit_evidence/
          retention-days: 90
          if-no-files-found: error
