name: H1 developer bridge prepared-reference continuation

on:
  push:
    branches:
      - experiment/h1-developer-thermal-bridge
    paths:
      - .github/workflows/h1-dev-bridge-bound-reference-once.yml

permissions:
  contents: read

concurrency:
  group: sim-heat-developer-bridge-one-shot
  cancel-in-progress: false

jobs:
  bridge:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAN_PIN: 27f7ac1ec97b2b832ed3b00cf1e6afceacf345e27f3bddf2be42bd143ceb2217
    steps:
      - name: Checkout fixed physical case and frozen implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned production and checking-only dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Run complete offline suite and seal bridge reference on this host
        run: python -B tools/h1_native_batch.py prepare --plan experiments/dev_bridge/native_plan_bound_reference.json --pin "$PLAN_PIN"
      - name: Preserve unused preparation and independently calculate reference accuracy
        run: |
          cp dev_bridge_native_attempt/attempt.json dev_bridge_native_attempt/prepared_attempt.json
          python -B experiments/dev_bridge/check_reference_accuracy.py --bundle dev_bridge_native_attempt/case_01/reference.bundle.json --attempt dev_bridge_native_attempt/prepared_attempt.json --out dev_bridge_native_attempt/reference_accuracy.json > dev_bridge_native_attempt/reference_accuracy.log 2>&1
      - name: Set up OpenModelica 1.27.0 with MSL 4.0.0
        uses: OpenModelica/setup-openmodelica@419f31141aa79a22f7033def5626047dd3bb5069
        with:
          version: '1.27.0'
          packages: |
            omc
          libraries: |
            Modelica 4.0.0
      - name: One build and launch through unchanged runner and checker
        run: python -B tools/h1_native_batch.py execute --plan experiments/dev_bridge/native_plan_bound_reference.json --pin "$PLAN_PIN"
      - name: Preserve inputs, raw output, pre-native accuracy and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-dev-bridge-bound-reference-evidence
          path: dev_bridge_native_attempt/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
