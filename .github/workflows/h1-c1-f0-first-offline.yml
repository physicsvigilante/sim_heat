name: H1-C1 F0 first submission — offline-only original admission
on:
  push:
    branches:
      - qualification/h1-c1-f0-first-offline
    paths:
      - 'h1/cases/H1_C1_FIRST/**'
      - 'qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256'
      - '.github/workflows/h1-c1-f0-first-offline.yml'
permissions:
  contents: read
concurrency:
  group: simheat-c1-f0-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  first-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the exact frozen F0 source and original first author data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install checking-only Python dependencies (never OpenModelica)
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Preserve original frozen code and first-author byte identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c1_f0_first_ci_evidence
          git rev-parse HEAD > c1_f0_first_ci_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > c1_f0_first_ci_evidence/tree-sha.txt
          git diff --name-status dd8c9432abe97563414bb3ed809e61e673473812 HEAD > c1_f0_first_ci_evidence/from-f0.diff
          git ls-files -z | xargs -0 sha256sum > c1_f0_first_ci_evidence/source.sha256
          python --version > c1_f0_first_ci_evidence/python.txt
          node --version > c1_f0_first_ci_evidence/node.txt
          sha256sum -c qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256 | tee c1_f0_first_ci_evidence/original-f0-fingerprints.log
          cat > c1_f0_first_ci_evidence/first-author-pins.sha256 <<'AUTHOR_PINS'
9a165e5ce2cc85da84ecc8bc4e63e2990f2066f3547dc6ba8508fa1afbe5f435  h1/cases/H1_C1_FIRST/model.mo
b235d4242728c44dd994e09db3ffd92d197398dde3fe6c8f006a801981997fdc  h1/cases/H1_C1_FIRST/study.json
eac5f720bb744d572a0ff7219825856e140f17f29fac0c3aff0218de15d69d0a  h1/cases/H1_C1_FIRST/AUTHOR_NOTES.md
AUTHOR_PINS
          sha256sum -c c1_f0_first_ci_evidence/first-author-pins.sha256 | tee c1_f0_first_ci_evidence/original-author-fingerprints.log
          python - <<'PY'
          from pathlib import Path
          expected={
              'h1/cases/H1_C1_FIRST/model.mo',
              'h1/cases/H1_C1_FIRST/study.json',
              'h1/cases/H1_C1_FIRST/AUTHOR_NOTES.md',
              'qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256',
              '.github/workflows/h1-c1-f0-first-offline.yml',
          }
          lines=Path('c1_f0_first_ci_evidence/from-f0.diff').read_text().splitlines()
          changed={line.split('\t',1)[1] for line in lines}
          assert changed==expected,(changed,expected)
          assert all(line.startswith('A\t') for line in lines),lines
          PY
      - name: Frozen F0 read-only CLI first original author submission
        shell: bash
        run: |
          set -uo pipefail
          python -B -m h1 h1/cases/H1_C1_FIRST/study.json --root h1/cases > c1_f0_first_ci_evidence/first-offline-admission.json 2> c1_f0_first_ci_evidence/first-offline-stderr.txt
          code=$?
          echo "$code" > c1_f0_first_ci_evidence/first-offline-exit-code.txt
          cat c1_f0_first_ci_evidence/first-offline-admission.json
          # Preserve any genuine first refusal and stop; never repair it.
          exit "$code"
      - name: Unmodified F0 H1 offline regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee c1_f0_first_ci_evidence/f0-h1-tests.log
      - name: Preserve source IDs, original refusal/admission and CI logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-c1-f0-first-offline-${{ github.sha }}
          path: c1_f0_first_ci_evidence/
          if-no-files-found: warn
          retention-days: 90
