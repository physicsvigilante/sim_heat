name: Product entry and exact post-merge baseline - offline only
on:
  push:
    branches: [product/explorer-entry]
  pull_request:
    branches: [main]
    paths:
      - index.html
      - README.md
      - docs/CAPABILITIES.md
      - tests/**
      - .github/workflows/product-entry-ci.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: simheat-product-entry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: postmerge-baseline
            ref: 4162c3d47016150076b226ebe2585073a785547a
          - kind: candidate
            ref: ${{ github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned checking and browser dependencies, never OpenModelica
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 playwright==1.57.0
      - name: Select Chromium
        run: |
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif command -v chromium >/dev/null; then chromium --version
          else python -m playwright install --with-deps chromium; fi
      - name: Record actual checkout and run existing complete offline suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product_evidence
          git rev-parse HEAD > product_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > product_evidence/head-tree.txt
          git diff --name-status 4162c3d47016150076b226ebe2585073a785547a HEAD > product_evidence/source-diff.txt
          git diff --exit-code 4162c3d47016150076b226ebe2585073a785547a HEAD -- h1 experiments qualification viewer
          python -m pip freeze > product_evidence/packages.txt
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee product_evidence/h1.log
          python -B -m unittest discover -s experiments/h1_spike/checks -v 2>&1 | tee product_evidence/arithmetic.log
          python -B -m unittest discover -s viewer/network/tests -p 'test_*.py' -v 2>&1 | tee product_evidence/adapters.log
          node --test viewer/tests/*.test.mjs viewer/network/tests/*.test.mjs 2>&1 | tee product_evidence/node.log
          python -B viewer/network/tools/build_compare_index.py --out product_evidence/compare-replayed.json
          cmp viewer/network/data/compare_index.json product_evidence/compare-replayed.json
      - name: Replay all original archives without executing native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/original-archives
          for id in 14152886226 14155084346 14204656273 14215520616 14153251022; do
            gh api "repos/physicsvigilante/sim_heat/actions/artifacts/$id/zip" > "/tmp/original-archives/artifact-$id.zip"
          done
          python -B viewer/network/tools/replay_published_archives.py --archives /tmp/original-archives > product_evidence/archive-replay.json
      - name: Existing full explorer browser checks
        shell: bash
        run: |
          set -euo pipefail
          python -B viewer/network/tests/browser_smoke.py --out product_evidence/explorer 2>&1 | tee product_evidence/browser.log
      - name: New navigation and registry tests
        if: matrix.kind == 'candidate'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee product_evidence/entry-tests.log
          python -B tests/browser_product_entry.py --out product_evidence/entry 2>&1 | tee product_evidence/entry-browser.log
          sha256sum index.html README.md docs/CAPABILITIES.md tests/*.py > product_evidence/entry-sources.sha256
      - name: Retain actual checkout identity, logs, replay and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-entry-${{ matrix.kind }}-${{ github.sha }}
          path: product_evidence/
          if-no-files-found: error
          retention-days: 90
