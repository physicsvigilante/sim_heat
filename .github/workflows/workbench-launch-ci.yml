name: Offline workbench launch
on:
  pull_request:
    branches: [codex/preview-provenance]
permissions:
  contents: read
jobs:
  launch:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: >-
          python -m pip install --only-binary=:all: -r requirements-h1-ci.txt
      - run: python -B -m unittest -v tests.test_authoring_workbench.LocalAuthoringWorkbenchTests.test_direct_script_launch_from_an_unrelated_directory tests.test_preview_identity
      - if: runner.os == 'Linux'
        run: python -B -m unittest discover -s tests -v
