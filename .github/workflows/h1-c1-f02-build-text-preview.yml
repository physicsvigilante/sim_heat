name: H1-C1 F02 frozen build-text preview (NO OMC invocation)
on:
  push:
    branches:
      - qualification/h1-c1-f02-nonregenerating-build-preview
permissions:
  contents: read
concurrency:
  group: simheat-h1-c1-f02-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-build-text-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact historical source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin Python 3.13.5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install checking-only Python dependencies (not Modelica)
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
      - name: Strict historical preservation and new-files-only check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c1_f02_build_preview_evidence
          git rev-parse HEAD > c1_f02_build_preview_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > c1_f02_build_preview_evidence/head-tree.txt
          git diff --name-status 2f2b8d5008f51b9972897058328aed8cbcbfbbce HEAD > c1_f02_build_preview_evidence/focused-diff.txt
          git ls-files -z | xargs -0 sha256sum > c1_f02_build_preview_evidence/source.sha256
          sha256sum --check qualification/h1_c1/evaluation/F0_ORIGINAL_PINS.sha256 > c1_f02_build_preview_evidence/f0-original-shas.txt
          python - <<'PY'
          from pathlib import Path
          expected={
            '.github/workflows/h1-c1-f02-build-text-preview.yml',
            'qualification/h1_c1/f02/offline_build_script_preview.py',
            'qualification/h1_c1/f02/test_offline_build_script_preview.py',
            'qualification/h1_c1/f02/BUILD_TEXT_PREVIEW_SCOPE.md',
          }
          rows=Path('c1_f02_build_preview_evidence/focused-diff.txt').read_text().splitlines()
          assert len(rows)==len(expected),rows
          assert all(row.startswith('A\t') for row in rows),rows
          assert {row.split('\t',1)[1] for row in rows}==expected,rows
          PY
          printf '%s  %s\n' 'fc5a7df5928c3fb8aef2ba4af516dfbd32b42c0450ebef1051ad4fd7efebd17f' 'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE.json.xz' | sha256sum -c
          printf '%s  %s\n' '50467b138ed64cdb908f2c763bc777e6babf0bb04a0711568acc559112e66f84' 'qualification/h1_c1/immutable_fixture/PR31_V2_REFERENCE_MANIFEST.json' | sha256sum -c
          python --version > c1_f02_build_preview_evidence/python.txt
          python -m pip freeze > c1_f02_build_preview_evidence/packages.txt
      - name: Stage original source and approved raw reference without native work
        shell: bash
        run: |
          set -euo pipefail
          python -B -m qualification.h1_c1.f02.stage_immutable_inputs stage-offline-only --label ci-text-preview > c1_f02_build_preview_evidence/source-stage-receipt.json
          python -B -m qualification.h1_c1.f02.offline_build_script_preview preview-text-only --label ci-text-preview > c1_f02_build_preview_evidence/text-preview-receipt.json
          python -B -m qualification.h1_c1.f02.offline_build_script_preview verify-preview-only --label ci-text-preview > c1_f02_build_preview_evidence/text-preview-readback.json
          python - <<'PY'
          import json
          from pathlib import Path
          parent=Path('c1_f02_build_preview_evidence')
          a=json.loads((parent/'text-preview-receipt.json').read_text())
          b=json.loads((parent/'text-preview-readback.json').read_text())
          assert a==b and a['status']=='NONEXECUTABLE_BUILD_TEXT_PREVIEW_VERIFIED'
          assert a['referenceRawSha256']=='0db511dd8dba023d16518667de256029cf3e073463ea21e2478aeac8afd1f368'
          assert a['referenceSeal']=='d2b8e2ca8e1f929cac7b028dcc3f7d0b453921d193f877eb091e23ac70aa4ce9'
          for flag in ('nativeAllowed','omcVersionQueried','buildInvoked','modelLaunched',
                       'nativeExecuted','nativeQualified','ownerNativeLaunchApproved',
                       'oneShotReservationAllocated','referenceRegenerated',
                       'releaseTrustRootComplete'):
              assert a[flag] is False,flag
          preview=parent/'ci-text-preview'
          assert {p.name for p in preview.iterdir()}=={
            'unexecuted-build-script.mos.txt','NONNATIVE_BUILD_PREVIEW_MANIFEST.json'}
          text=(preview/'unexecuted-build-script.mos.txt').read_text()
          assert text.count('buildModel(')==1
          for name in ('build.mos','model','model_res.mat','run.sh','model.exe'):
              assert not (preview/name).exists()
          print('PASS: source-bound nonexecuting Modelica build-text preview only')
          PY
      - name: No executable native CLI action
        shell: bash
        run: |
          set -euo pipefail
          for action in execute compile build launch native approve run; do
            if python -B -m qualification.h1_c1.f02.offline_build_script_preview "${action}" --label ci-text-preview > c1_f02_build_preview_evidence/denied-${action}.stdout 2> c1_f02_build_preview_evidence/denied-${action}.stderr; then
              echo 'FAIL: unexpected native action'; exit 1
            fi
          done
      - name: New offline text-preview tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.f02.test_offline_build_script_preview -v 2>&1 | tee c1_f02_build_preview_evidence/build-text-tests.txt
      - name: Regress original F02 staging, plan, adopted reference, and archive
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest qualification.h1_c1.f02.test_stage_immutable_inputs -v 2>&1 | tee c1_f02_build_preview_evidence/input-stage-tests.txt
          python -B -m unittest qualification.h1_c1.f02.test_offline_control_preflight -v 2>&1 | tee c1_f02_build_preview_evidence/plan-type-tests.txt
          python -B -m unittest qualification.h1_c1.option_a.test_offline_reference_consumer -v 2>&1 | tee c1_f02_build_preview_evidence/approved-reference-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_option_a_binding_preflight -v 2>&1 | tee c1_f02_build_preview_evidence/binding-tests.txt
          python -B -m unittest qualification.h1_c1.immutable_fixture.test_pr31_fixture -v 2>&1 | tee c1_f02_build_preview_evidence/archive-tests.txt
      - name: All 149 original frozen H1 tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee c1_f02_build_preview_evidence/frozen-h1-tests.txt
      - name: Retain all offline evidence, refusals and failed logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-c1-f02-build-text-preview-${{ github.sha }}
          path: c1_f02_build_preview_evidence/
          if-no-files-found: warn
          retention-days: 90
