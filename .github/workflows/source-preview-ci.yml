name: Novel composition source-only preview - OFFLINE no OMC
on:
  push:
    branches: [product/novel-source-preview]
  pull_request:
    branches: [main]
    paths:
      - h1/source_preview.py
      - h1/cases/TEACH_SPLIT3/**
      - experiments/teacher_split3/**
      - viewer/source_preview/**
      - tests/test_source_preview.py
      - tests/browser_source_preview.py
      - docs/ADMITTED_SOURCE_PREVIEW.md
      - .github/workflows/source-preview-ci.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: simheat-novel-source-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install checking-only pinned dependencies, never OpenModelica
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 playwright==1.57.0
      - name: Select Chromium
        run: |
          if command -v google-chrome >/dev/null; then google-chrome --version
          elif command -v chromium >/dev/null; then chromium --version
          else python -m playwright install --with-deps chromium; fi
      - name: Exact source identity, protected-code comparison and full offline suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_preview_evidence
          git rev-parse HEAD > source_preview_evidence/head-sha.txt
          git rev-parse HEAD^{tree} > source_preview_evidence/head-tree.txt
          # On pull_request, the actual checkout is GitHub's synthetic merge.
          # Its first parent is the ACTUAL current base; event.base.sha may
          # remain stale briefly after another PR has already merged.
          # Its second parent must be this reviewed candidate HEAD.
          # Branch pushes remain checked against the original reviewed base.
          scope_base=0278b79b4da1c3196edca7903189713e0482f3f6
          if [ "${{ github.event_name }}" = pull_request ]; then
            scope_base="$(git rev-parse HEAD^1)"
            candidate_parent="$(git rev-parse HEAD^2)"
            test "$candidate_parent" = "${{ github.event.pull_request.head.sha }}"
          fi
          git cat-file -e "${scope_base}^{commit}"
          printf '%s\n' "$scope_base" > source_preview_evidence/scope-base-sha.txt
          git diff --name-status "$scope_base" HEAD > source_preview_evidence/source-diff.txt
          python - <<'PY'
          from pathlib import Path
          rows=Path('source_preview_evidence/source-diff.txt').read_text().splitlines()
          allowed={
              'A\t.github/workflows/source-preview-ci.yml',
              'A\tdocs/ADMITTED_SOURCE_PREVIEW.md',
              'A\texperiments/teacher_split3/TASK.md',
              'A\th1/cases/TEACH_SPLIT3/model.mo',
              'A\th1/cases/TEACH_SPLIT3/study.json',
              'A\th1/source_preview.py',
              'A\ttests/browser_source_preview.py',
              'A\ttests/test_source_preview.py',
              'A\tviewer/source_preview/README.md',
              'A\tviewer/source_preview/app.mjs',
              'A\tviewer/source_preview/core.mjs',
              'A\tviewer/source_preview/core.test.mjs',
              'A\tviewer/source_preview/data/TEACH_SPLIT3.json',
              'A\tviewer/source_preview/index.html',
          }
          assert set(rows)==allowed and len(rows)==len(allowed),rows
          PY
          git diff --exit-code "$scope_base" HEAD -- viewer/network qualification tools/h1_native_batch.py h1/model.py h1/study.py h1/policy.py h1/reference.py h1/verification.py
          python -m pip freeze > source_preview_evidence/packages.txt
          python -B -m unittest discover -s h1/tests -v 2>&1 | tee source_preview_evidence/h1.log
          python -B -m unittest discover -s experiments/h1_spike/checks -v 2>&1 | tee source_preview_evidence/arithmetic.log
          python -B -m unittest discover -s viewer/network/tests -p 'test_*.py' -v 2>&1 | tee source_preview_evidence/adapters.log
          python -B -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee source_preview_evidence/product.log
          node --test viewer/tests/*.test.mjs viewer/network/tests/*.test.mjs viewer/source_preview/core.test.mjs 2>&1 | tee source_preview_evidence/node.log
          python -B viewer/network/tools/build_compare_index.py --out source_preview_evidence/compare-replayed.json
          cmp viewer/network/data/compare_index.json source_preview_evidence/compare-replayed.json
          python -B -m h1 h1/cases/TEACH_SPLIT3/study.json --root h1/cases > source_preview_evidence/authored-admission.json
          python -B -m h1.source_preview h1/cases/TEACH_SPLIT3/study.json --root h1/cases --out source_preview_evidence/preview-replayed.json
          cmp viewer/source_preview/data/TEACH_SPLIT3.json source_preview_evidence/preview-replayed.json
      - name: Replay original six diagnostic archives, no native binary launched
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/original-archives
          for id in 14152886226 14155084346 14204656273 14215520616 14153251022; do
            gh api "repos/physicsvigilante/sim_heat/actions/artifacts/$id/zip" > "/tmp/original-archives/artifact-$id.zip"
          done
          python -B viewer/network/tools/replay_published_archives.py --archives /tmp/original-archives > source_preview_evidence/archive-replay.json
      - name: Existing full explorer and new source-only Chromium interaction
        shell: bash
        run: |
          set -euo pipefail
          python -B viewer/network/tests/browser_smoke.py --out source_preview_evidence/historical-browser 2>&1 | tee source_preview_evidence/historical-browser.log
          python -B tests/browser_product_entry.py --out source_preview_evidence/product-entry 2>&1 | tee source_preview_evidence/product-entry.log
          python -B tests/browser_source_preview.py --out source_preview_evidence/source-browser 2>&1 | tee source_preview_evidence/source-browser.log
      - name: Retain exact-source logs, original preservation and browser refusal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: novel-source-preview-${{ github.sha }}
          path: source_preview_evidence/
          retention-days: 90
          if-no-files-found: error
